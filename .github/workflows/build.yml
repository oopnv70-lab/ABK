name: Build PKG110 Kernel

# ---------------------------------------------------------------------------
# 设计原则
# 1. 源码只在 runner 上现场 repo sync，本仓库不存任何内核源码
# 2. 编译器有两条路，用 builder 输入切换：
#      make  —— 已在本机 run 44970501662 实证成功（Ace5 这棵树不会撞
#               __stack_chk_guard，那是 sm7675 那棵树的问题），默认走这条
#      bazel —— OnePlusOSS 维护者推荐的 Kleaf 路线，保留作为交叉验证
# 3. 管理器走 SukiSU-Nova 的 LKM 路线：产出 kernelsu.ko，不改内核源码
#    （不用 kernel/setup.sh，那会改 drivers/Makefile、drivers/Kconfig）
# 4. 每次构建把 manifest / 分支 / 各仓库 commit / KSU 版本写进 summary，产物可回溯
# ---------------------------------------------------------------------------

on:
  # 只允许手动触发：一次构建 40~120 分钟，绝不能让每次 commit 都烧额度
  workflow_dispatch:
    inputs:
      builder:
        description: '编译方式：make = 已实证成功；bazel = 官方推荐的 Kleaf 路线'
        required: true
        type: choice
        default: 'make'
        options:
          - make
          - bazel
      device_manifest:
        description: 'OnePlusOSS kernel_manifest 里的设备 xml'
        required: true
        default: 'oneplus_ace5_b.xml'
      manifest_branch:
        description: 'kernel_manifest 分支'
        required: true
        default: 'oneplus/sm8650'
      ksu_variant:
        description: 'KSU 变体（默认就带 SukiSU-Nova；none 只用于验证纯净基座）'
        required: true
        type: choice
        default: 'SukiSU-Nova'
        options:
          - SukiSU-Nova
          - none
      ksu_ref:
        description: 'SukiSU-Nova 使用的分支/标签'
        required: true
        default: 'main'
      enable_kpm:
        description: '给 kernelsu.ko 打开 CONFIG_KPM（KPM 模块功能）'
        required: true
        type: boolean
        default: true
      bazel_config:
        description: '仅 builder=bazel 时生效：fast = 关 LTO 少验证'
        required: true
        type: choice
        default: 'fast'
        options:
          - fast
          - local

concurrency:
  group: pkg110-kernel-build
  cancel-in-progress: false

permissions:
  contents: read

env:
  KP_DIR: ${{ github.workspace }}/kp
  KERNEL_PLATFORM: ${{ github.workspace }}/kp/kernel_platform
  BUILDER: ${{ inputs.builder || 'make' }}
  DEVICE_MANIFEST: ${{ inputs.device_manifest || 'oneplus_ace5_b.xml' }}
  MANIFEST_BRANCH: ${{ inputs.manifest_branch || 'oneplus/sm8650' }}
  KSU_VARIANT: ${{ inputs.ksu_variant || 'SukiSU-Nova' }}
  KSU_REF: ${{ inputs.ksu_ref || 'main' }}
  ENABLE_KPM: ${{ inputs.enable_kpm == false && 'false' || 'true' }}
  BAZEL_CONFIG: ${{ inputs.bazel_config || 'fast' }}

jobs:
  build:
    name: kernel-build
    runs-on: ubuntu-24.04
    timeout-minutes: 300

    steps:
      - name: 检出本仓库（只要 workflow/脚本，不要源码）
        uses: actions/checkout@v4

      - name: 释放磁盘空间
        run: |
          set -euxo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      /usr/lib/jvm /usr/local/.ghcup || true
          sudo apt-get clean
          df -h /

      - name: 安装构建依赖
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            git-core gnupg flex bison build-essential zip unzip curl zlib1g-dev \
            libc6-dev libncurses-dev libssl-dev libelf-dev bc cpio rsync \
            python3 python3-pip dwarves lz4 device-tree-compiler ccache \
            file libarchive-tools

      - name: 安装 repo 工具
        run: |
          set -euxo pipefail
          mkdir -p ~/bin
          curl -fsSL https://raw.githubusercontent.com/GerritCodeReview/git-repo/main/repo \
               -o ~/bin/repo
          chmod +x ~/bin/repo
          echo "$HOME/bin" >> "$GITHUB_PATH"
          ~/bin/repo --version

      - name: 准备 ccache 缓存
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ env.DEVICE_MANIFEST }}-${{ env.BUILDER }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ env.DEVICE_MANIFEST }}-${{ env.BUILDER }}-
            ccache-${{ env.DEVICE_MANIFEST }}-

      - name: 现场拉取一加内核源码（repo sync）
        run: |
          set -euxo pipefail
          mkdir -p "$KP_DIR"
          cd "$KP_DIR"

          git config --global user.name  "github-actions"
          git config --global user.email "github-actions@github.com"
          git config --global url."https://github.com/".insteadOf "git@github.com:"

          repo init \
            -u https://github.com/OnePlusOSS/kernel_manifest.git \
            -b "$MANIFEST_BRANCH" \
            -m "$DEVICE_MANIFEST" \
            --depth=1 \
            --no-repo-verify

          repo sync -c --no-tags --optimized-fetch -j"$(nproc)" --force-sync

          echo "==== 拉取结果 ===="
          du -sh "$KP_DIR"
          df -h /
          grep -E 'name=|revision=' ".repo/manifests/$DEVICE_MANIFEST" | head -40

      # ---------------------------------------------------------------------
      # 路线 A：make —— 已实证（run 44970501662 退出码 0，Image 已产出）
      # 注意这与 sm7675 issue #2 的失败不同：Ace5 这棵树的 gki_defconfig 下
      # all 能过 modpost，没有 __stack_chk_guard 批量 undefined。
      # ---------------------------------------------------------------------
      - name: 编译内核（make）
        if: env.BUILDER == 'make'
        run: |
          set -euxo pipefail
          COMMON="$KERNEL_PLATFORM/common"
          cd "$COMMON"

          CLANG_DIR=$(find "$KERNEL_PLATFORM/prebuilts/clang/host/linux-x86" -maxdepth 2 -type d -name bin | head -1)
          export PATH="$CLANG_DIR:$PATH"
          export CCACHE_DIR="$HOME/.ccache"
          export CCACHE_MAXSIZE="12G"
          clang --version | head -2
          ccache -z

          PAHOLE_BIN="$KERNEL_PLATFORM/prebuilts/kernel-build-tools/linux-x86/bin/pahole"

          make -j"$(nproc)" \
            LLVM=1 ARCH=arm64 \
            CC="ccache clang" \
            LD=ld.lld HOSTLD=ld.lld \
            PAHOLE="$PAHOLE_BIN" \
            O=out \
            gki_defconfig all 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

          ccache -s

      # ---------------------------------------------------------------------
      # 路线 B：Kleaf / Bazel —— OnePlusOSS 维护者在 issue #2 推荐
      #   tools/bazel build --config=fast //common:kernel_aarch64_dist
      # 尚未在本仓库跑过，保留用来交叉验证 make 的产物
      # ---------------------------------------------------------------------
      - name: 编译内核（Kleaf / Bazel）
        if: env.BUILDER == 'bazel'
        run: |
          set -euxo pipefail
          cd "$KERNEL_PLATFORM"

          ls prebuilts/ 2>/dev/null || true

          export CCACHE_DIR="$HOME/.ccache"
          export CCACHE_MAXSIZE="12G"
          ccache -z

          # 官方文档原文是 tools/bazel run（不是 build）：
          #   tools/bazel run //common:kernel_aarch64_dist [-- --destdir=$DIST_DIR]
          # run 才会真正落地 dist 产物；build 只构建不导出。
          tools/bazel run --config="$BAZEL_CONFIG" //common:kernel_aarch64_dist \
            -- --destdir="$KERNEL_PLATFORM/dist" \
            2>&1 | tee "$GITHUB_WORKSPACE/build.log"

          ccache -s

          echo "==== bazel 产物一览 ===="
          ls -la bazel-bin/common/ || true
          du -sh bazel-bin 2>/dev/null || true
          df -h /

      # ---------------------------------------------------------------------
      # 定位 Image。两条路线的落点不同，全部列出并写进 Step Summary，
      # 不静默成功、也不猜。
      # ---------------------------------------------------------------------
      - name: 定位内核产物
        id: artifacts
        run: |
          set -euo pipefail
          cd "$KERNEL_PLATFORM"

          CANDIDATES=(
            "common/out/arch/arm64/boot"
            "bazel-bin/common/kernel_aarch64_gki_artifacts"
            "bazel-bin/common/kernel_aarch64_dist"
            "out/dist"
          )

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### 产物探测" >> "$GITHUB_STEP_SUMMARY"
          echo "| 候选目录 | 存在 | 内容 |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          for d in "${CANDIDATES[@]}"; do
            if [ -d "$d" ]; then
              echo "| \`$d\` | 有 | $(ls "$d" 2>/dev/null | head -12 | tr '\n' ' ') |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "| \`$d\` | 无 | - |" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

          IMAGE=""
          for d in "${CANDIDATES[@]}"; do
            for n in Image Image.gz Image.lz4 Image.bz2; do
              if [ -f "$d/$n" ]; then IMAGE="$d/$n"; break 2; fi
            done
          done
          if [ -z "$IMAGE" ]; then
            IMAGE=$(find . -maxdepth 6 -path './.repo' -prune -o -name 'Image' -type f -print 2>/dev/null | head -1 || true)
          fi
          if [ -z "$IMAGE" ]; then
            echo "::error::构建结束但找不到 Image，请看上方候选目录清单"
            exit 1
          fi
          echo "IMAGE=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "找到内核镜像：$IMAGE ($(du -h "$IMAGE" | cut -f1))"

      # ---------------------------------------------------------------------
      # SukiSU-Nova LKM
      # 依据：SukiSU-Nova 自己的 .github/workflows/ddk-lkm.yml（arm64 分支）
      #   cd kernel && make CONFIG_KSU=m CONFIG_KPM=y CC=clang
      # 它要求 KDIR 是一棵「已有 vmlinux + Module.symvers」的内核树。
      # ---------------------------------------------------------------------
      - name: 准备 KDIR（外部模块编译用的内核树）
        if: env.KSU_VARIANT != 'none'
        id: kdir
        run: |
          set -euxo pipefail
          COMMON="$KERNEL_PLATFORM/common"
          KLEAF_OUT="$KERNEL_PLATFORM/bazel-bin/common/kernel_aarch64"

          CLANG_DIR=$(find "$KERNEL_PLATFORM/prebuilts/clang/host/linux-x86" -maxdepth 2 -type d -name bin | head -1)
          export PATH="$CLANG_DIR:$PATH"

          if [ "$BUILDER" = "make" ]; then
            # make 路线的 O=out 本身就是一次完整 make 的 objtree：
            # .config / vmlinux / Module.symvers / usr/include 全都在，
            # 直接拿来当 KDIR 最准确——它是产出当前 Image 的那棵树本身。
            KDIR="$COMMON/out"
            echo "使用 make 的 objtree 作为 KDIR：$KDIR"
          else
            KDIR="$KERNEL_PLATFORM/ksu-kdir"
            mkdir -p "$KDIR"

            echo "==== 探测 Kleaf objtree ===="
            [ -d "$KLEAF_OUT" ] && ls "$KLEAF_OUT" | head -40 || echo "未找到 $KLEAF_OUT"

            make -C "$COMMON" O="$KDIR" ARCH=arm64 LLVM=1 gki_defconfig
            make -C "$COMMON" O="$KDIR" ARCH=arm64 LLVM=1 modules_prepare -j"$(nproc)"
            make -C "$COMMON" O="$KDIR" ARCH=arm64 LLVM=1 security/selinux/built-in.a -j"$(nproc)"

            # 符号表必须来自 Kleaf 那次构建，保证与刷入内核一致
            for f in vmlinux Module.symvers System.map; do
              if [ -f "$KLEAF_OUT/$f" ]; then
                cp -v "$KLEAF_OUT/$f" "$KDIR/$f"
              else
                echo "::warning::$f 在 Kleaf objtree 中未找到"
              fi
            done
          fi

          echo "--- KDIR 关键文件 ---"
          for f in .config vmlinux Module.symvers System.map usr/include/linux/unistd.h; do
            printf '%-32s %s\n' "$f" "$([ -f "$KDIR/$f" ] && echo OK || echo MISSING)"
          done

          echo "KDIR=$KDIR" >> "$GITHUB_OUTPUT"

      - name: 编译 kernelsu.ko（SukiSU-Nova LKM）
        if: env.KSU_VARIANT != 'none'
        id: ksu
        run: |
          # 故意不开 -e：要自己区分「编译失败」和「符号校验失败」两种，
          # 并且把错误打进 annotation，方便远程定位（日志下载链接常被 DNS 拦）
          set -uo pipefail
          KDIR="${{ steps.kdir.outputs.KDIR }}"
          LOG="$GITHUB_WORKSPACE/ksu-build.log"
          cd "$GITHUB_WORKSPACE"

          git clone --depth=1 -b "$KSU_REF" \
            https://github.com/SukiSU-Nova/SukiSU-Nova.git sukisu
          echo "- SukiSU-Nova: \`$(git -C sukisu rev-parse HEAD)\` $(git -C sukisu log -1 --format='%ad %s')" \
            >> "$GITHUB_STEP_SUMMARY"

          CLANG_DIR=$(find "$KERNEL_PLATFORM/prebuilts/clang/host/linux-x86" -maxdepth 2 -type d -name bin | head -1)
          export PATH="$CLANG_DIR:$PATH"
          echo "clang: $(which clang)"

          cd sukisu/kernel

          # 注意：不要用 SukiSU 的 `make KDIR=...`。
          # 它的 Makefile 做的是 `make -C $(KDIR) M=...`，要求 KDIR 目录本身
          # 能当源码树用；而内核 5.x 起删除了 scripts/mkmakefile，`make O=`
          # 的输出目录里不再生成 Makefile，-C 进去必然报
          # "No rule to make target 'modules'"。
          # 正确写法（内核文档标准形式）：-C <源码树> O=<输出目录> M=<模块>
          KSRC="$KERNEL_PLATFORM/common"
          MDIR="$GITHUB_WORKSPACE/sukisu/kernel"

          # ARCH/LLVM 必须显式给：GitHub runner 是 x86_64，不传的话 Kbuild 用
          # SUBARCH=x86_64 推 SRCARCH=x86，include 里全是 x86 的 arch 头，
          # arm64 的 asm/compiler.h 自然找不到。
          # src= 在 6.1 无意义（6.18+ 才有），去掉避免副作用。
          ARGS=(ARCH=arm64 LLVM=1 O="$KDIR" M="$MDIR" CONFIG_KSU=m)
          if [ "$ENABLE_KPM" = "true" ]; then
            ARGS+=(CONFIG_KPM=y)
          fi
          echo "== make -C $KSRC ${ARGS[*]} modules =="

          # 第一步：只编模块。失败=编译错误（含缺失头/符号冲突）
          if ! make -C "$KSRC" "${ARGS[@]}" modules 2>&1 | tee "$LOG"; then
            echo "::error::kernelsu.ko 编译失败（编译阶段）"
            grep -nE 'error:|fatal error|Error [0-9]|No rule|No such file|undefined' "$LOG" \
              | head -10 | while IFS= read -r l; do echo "::error::${l:0:900}"; done
            exit 1
          fi
          echo "::notice::kernelsu.ko 编译通过"

          cd "$MDIR"
          ls -lh kernelsu.ko || { echo "::error::没生成 kernelsu.ko"; exit 1; }

          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp kernelsu.ko "$GITHUB_WORKSPACE/dist/kernelsu.ko"

          # 第二步：官方符号校验。失败说明 .ko 依赖的符号在这颗内核里不可用，
          # 刷进去会 Unknown symbol —— 必须当错误处理，不能静默放过。
          if [ -f "$KDIR/vmlinux" ]; then
            echo "== check_symbol =="
            clang tools/check_symbol.c -o check_symbol 2>&1 | tee -a "$LOG" || true
            if [ -x ./check_symbol ] && ./check_symbol kernelsu.ko "$KDIR/vmlinux" 2>&1 | tee -a "$LOG"; then
              echo "::notice::check_symbol 通过"
            else
              echo "::error::check_symbol 失败：kernelsu.ko 依赖的符号与内核不匹配"
              grep -nE 'not found|not exported|LOCAL|ERROR|error|symbol' "$LOG" \
                | tail -10 | while IFS= read -r l; do echo "::error::${l:0:900}"; done
              exit 1
            fi
          else
            echo "::warning::KDIR 没有 vmlinux，跳过 check_symbol（产物未做符号校验）"
          fi

          llvm-strip -d kernelsu.ko || strip -d kernelsu.ko || true
          cp kernelsu.ko "$GITHUB_WORKSPACE/dist/kernelsu.ko"

          echo "--- vermagic / 版本摘要 ---"
          strings kernelsu.ko | grep -iE 'vermagic=|SukiSU|KernelSU' | head -5 || true
          ls -lh "$GITHUB_WORKSPACE/dist/kernelsu.ko"

      - name: 记录构建指纹
        if: always()
        run: |
          set -euo pipefail
          {
            echo ""
            echo "### 构建指纹"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| builder | \`$BUILDER\` |"
            echo "| manifest | \`$DEVICE_MANIFEST\` @ \`$MANIFEST_BRANCH\` |"
            echo "| KSU 变体 | \`$KSU_VARIANT\` @ \`$KSU_REF\` |"
            echo "| KPM | \`$ENABLE_KPM\` |"
            for d in common msm-kernel; do
              if [ -d "$KERNEL_PLATFORM/$d/.git" ]; then
                ver=$(sed -n '2p;3p;4p' "$KERNEL_PLATFORM/$d/Makefile" 2>/dev/null | tr -d '\n ')
                sha=$(git -C "$KERNEL_PLATFORM/$d" rev-parse HEAD)
                br=$(git -C "$KERNEL_PLATFORM/$d" rev-parse --abbrev-ref HEAD)
                echo "| $d | \`$br\` \`$sha\` ($ver) |"
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 收集产物
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/dist"
          SRC="${{ steps.artifacts.outputs.IMAGE }}"
          if [ -n "${SRC:-}" ] && [ -f "$SRC" ]; then
            cp -v "$SRC" "$GITHUB_WORKSPACE/dist/Image"
          fi
          ls -lh "$GITHUB_WORKSPACE/dist" || true

      - name: 打包 AnyKernel3
        if: env.KSU_VARIANT != 'none'
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          if [ ! -f dist/Image ]; then
            echo "::warning::没有 Image，跳过 AnyKernel3 打包"
            exit 0
          fi

          git clone --depth=1 https://github.com/Xiaomichael/AnyKernel3 anykernel3
          rm -rf anykernel3/.git
          cp dist/Image anykernel3/Image
          # LKM 模式下内核本身不含 KSU，模块随包放同级目录，方便一起取用
          cp dist/kernelsu.ko anykernel3/kernelsu.ko || true

          ( cd anykernel3 && zip -q -r9 "../PKG110-${KSU_VARIANT}-${GITHUB_RUN_NUMBER}.zip" ./* )
          ls -lh ./*.zip

      - name: 上传产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PKG110-${{ env.KSU_VARIANT }}-${{ env.BUILDER }}-${{ github.run_number }}
          path: |
            dist/*
            *.zip
            build.log
            ksu-build.log
          if-no-files-found: warn