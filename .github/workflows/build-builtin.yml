name: Build PKG110 Kernel (builtin KSU)

# ---------------------------------------------------------------------------
# 这是 LKM 之外的第二条路：把 KSU 编进内核本体。
#
# 为什么另起一个文件而不是改 build.yml：
#   build.yml 那条 LKM 链（kernelsu.ko + check_symbol + __versions）是一条
#   独立的、已验证到「.ko 能生成」的资产，留着不砸。这条路并行验证。
#
# 与所有参考项目一致的地方（LingLuo17/AnyKernel3、Shark、MikSU 都是内置）：
#   - CONFIG_KSU=y，KSU 源码软链进 drivers/kernelsu，随 vmlinux 一起链接
#   - 产物只有 Image，没有 kernelsu.ko，没有 check_symbol，没有 __versions
#
# 与官方 setup.sh 的区别：
#   上游 setup.sh 会 `git checkout main` + `git checkout $(latest tag)`，
#   会把我们要的 builtin 分支切成 main。所以这里只做它等价的三件事
#   （symlink / drivers/Makefile / drivers/Kconfig），不跑那个脚本。
#
# 第一版明确不做的事（避免又变成猜测）：
#   1. 不打包 boot.img / AnyKernel3：先把「内置 KSU + SUSFS 能不能编出来」确认掉。
#      编出来之后打包才有意义。
#   2. SUSFS 冲突不自动改写：.rej 一律硬失败并列清单，逐个判断
#      （厂商重构了函数的那种，脚本硬改就是埋雷）。
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      ksu_ref:
        description: 'SukiSU-Nova 分支：builtin = 稳定内置；builtin-new = 新版 unity build'
        required: true
        type: choice
        default: 'builtin'
        options:
          - builtin
          - builtin-new
      device_manifest:
        description: 'OnePlusOSS kernel_manifest 里的设备 xml'
        required: true
        default: 'oneplus_ace5_b.xml'
      manifest_branch:
        description: 'kernel_manifest 分支'
        required: true
        default: 'oneplus/sm8650'
      enable_susfs:
        description: '打开 CONFIG_KSU_SUSFS（打 susfs4ksu 6.1 内核补丁；有 .rej 会硬失败并列清单）'
        required: true
        type: boolean
        default: true
      enable_kpm:
        description: '打开 CONFIG_KPM（SukiSU KPM 运行时模块加载；会 select KALLSYMS_ALL）'
        required: true
        type: boolean
        default: false
      enable_bbg:
        description: '打开 CONFIG_BBG（Baseband-guard 防格机 LSM；构建时按 pin 拉取源码，不入库）'
        required: true
        type: boolean
        default: true
      stock_localversion:
        description: 'stock 内核 release 的后缀，必须与设备原厂 uname -r 的后半截逐字一致'
        required: false
        default: '-android14-11-o-g984c12362a16'

concurrency:
  group: pkg110-kernel-builtin
  cancel-in-progress: false

permissions:
  contents: read

env:
  KP_DIR: ${{ github.workspace }}/kp
  KERNEL_PLATFORM: ${{ github.workspace }}/kp/kernel_platform
  DEVICE_MANIFEST: ${{ inputs.device_manifest || 'oneplus_ace5_b.xml' }}
  MANIFEST_BRANCH: ${{ inputs.manifest_branch || 'oneplus/sm8650' }}
  KSU_REF: ${{ inputs.ksu_ref || 'builtin' }}
  ENABLE_SUSFS: ${{ inputs.enable_susfs == true && 'true' || 'false' }}
  ENABLE_KPM: ${{ inputs.enable_kpm == true && 'true' || 'false' }}
  ENABLE_BBG: ${{ inputs.enable_bbg == true && 'true' || 'false' }}
  # Baseband-guard 上游 pin。和 SUSFS 一样固定 commit，不用分支头：
  # 否则构建产物会随上游漂移，且事后无法复现。
  # 48d9fdea = main @ 2026-11-23「feat: add Android18-7.3 support (#92)」
  BBG_REF: 48d9fdea643bcb41d204541400e9d8656b97a54f
  # SUSFS 上游 pin（GitLab，非 GitHub 镜像）。产物里的 SOURCE.md 也会引用它。
  SUSFS_REF: f76b81f2a6bf98e4029cc0c823c054edbec29803
  # stock 内核 release 的后半截（KERNELVERSION=6.1.141 之外的部分）。
  # 必须与设备原厂内核逐字一致：内核 check_modinfo() 拿它做 vermagic 比对，
  # 不匹配则 vendor_dlkm 里所有 .ko 拒绝加载 → 卡第一屏无限重启（无 panic）。
  STOCK_LOCALVERSION: ${{ inputs.stock_localversion || '-android14-11-o-g984c12362a16' }}

jobs:
  build-builtin:
    name: kernel-builtin
    runs-on: ubuntu-24.04
    timeout-minutes: 300

    steps:
      - name: 检出本仓库
        uses: actions/checkout@v4

      - name: 释放磁盘空间
        run: |
          set -euxo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      /usr/lib/jvm /usr/local/.ghcup || true
          sudo apt-get clean
          df -h /

      - name: 安装构建依赖
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            git-core gnupg flex bison build-essential zip unzip curl zlib1g-dev \
            libc6-dev libncurses-dev libssl-dev libelf-dev bc cpio rsync \
            python3 python3-pip dwarves lz4 device-tree-compiler ccache \
            file libarchive-tools

      # 性能归因用：把「机器多快」变成可比的数字，避免以后只能猜
      # 「是不是 runner 变慢了」。nproc 决定 make -j 的并行度，cpu.max 是容器配额。
      - name: 记录 runner 指纹与 CPU 基准
        run: |
          set -uo pipefail
          NPROC=$(nproc)
          CPUMODEL=$(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2- | sed 's/^ //')
          CPUMAX=$(cat /sys/fs/cgroup/cpu.max 2>/dev/null || echo 不可读)
          BENCH=$(python3 -c "import hashlib,time;b=b'x'*(1<<20);h=hashlib.sha256();n=160;t=time.time();[h.update(b) for _ in range(n)];d=time.time()-t;print('%.2fs (%.0f MB/s)'%(d,n/d))")
          echo "nproc=$NPROC"
          echo "cpu=$CPUMODEL"
          echo "cpu.max=$CPUMAX"
          echo "bench=$BENCH"
          df -h / | tail -1
          {
            echo ""
            echo "### runner 指纹"
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| nproc | $NPROC |"
            echo "| CPU | $CPUMODEL |"
            echo "| cgroup cpu.max | $CPUMAX |"
            echo "| CPU 微基准 sha256 160MB | $BENCH |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 安装 repo 工具
        run: |
          set -euxo pipefail
          mkdir -p ~/bin
          curl -fsSL https://raw.githubusercontent.com/GerritCodeReview/git-repo/main/repo \
               -o ~/bin/repo
          chmod +x ~/bin/repo
          echo "$HOME/bin" >> "$GITHUB_PATH"
          ~/bin/repo --version

      - name: 准备 ccache 缓存
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ env.DEVICE_MANIFEST }}-builtin-${{ github.run_id }}
          restore-keys: |
            ccache-${{ env.DEVICE_MANIFEST }}-builtin-
            ccache-${{ env.DEVICE_MANIFEST }}-

      - name: 现场拉取一加内核源码（repo sync）
        run: |
          set -euxo pipefail
          mkdir -p "$KP_DIR"
          cd "$KP_DIR"

          git config --global user.name  "github-actions"
          git config --global user.email "github-actions@github.com"
          git config --global url."https://github.com/".insteadOf "git@github.com:"

          repo init \
            -u https://github.com/OnePlusOSS/kernel_manifest.git \
            -b "$MANIFEST_BRANCH" \
            -m "$DEVICE_MANIFEST" \
            --depth=1 \
            --no-repo-verify

          repo sync -c --no-tags --optimized-fetch -j"$(nproc)" --force-sync

          echo "==== 拉取结果 ===="
          du -sh "$KP_DIR"
          df -h /

      # ---------------------------------------------------------------------
      # 把 SukiSU-Nova 的 kernel/ 软链进 drivers/kernelsu。
      # 等价于上游 setup.sh 的三个动作，但不执行它的 git checkout。
      # ---------------------------------------------------------------------
      - name: 集成 SukiSU-Nova（内置到 drivers/kernelsu）
        run: |
          set -euxo pipefail
          COMMON="$KERNEL_PLATFORM/common"

          cd "$KERNEL_PLATFORM"
          rm -rf KernelSU
          git clone --depth=1 -b "$KSU_REF" \
            https://github.com/SukiSU-Nova/SukiSU-Nova.git KernelSU

          echo "- SukiSU-Nova($KSU_REF): \`$(git -C KernelSU rev-parse HEAD)\` $(git -C KernelSU log -1 --format='%ad %s')" \
            >> "$GITHUB_STEP_SUMMARY"
          echo "==== 分支确认（必须是 $KSU_REF，且必须有 kernel/Kconfig）===="
          git -C KernelSU rev-parse --abbrev-ref HEAD
          ls -l KernelSU/kernel/Kconfig KernelSU/kernel/Makefile

          # 软链：drivers/kernelsu -> ../../KernelSU/kernel
          # common/drivers 的 ../../ 就是 kernel_platform
          ln -sfn ../../KernelSU/kernel "$COMMON/drivers/kernelsu"
          ls -l "$COMMON/drivers/kernelsu"
          test -f "$COMMON/drivers/kernelsu/Kconfig" || {
            echo "::error::软链后看不到 drivers/kernelsu/Kconfig"; exit 1; }

          # drivers/Makefile：obj-$(CONFIG_KSU) += kernelsu/
          grep -q 'kernelsu' "$COMMON/drivers/Makefile" || \
            printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> "$COMMON/drivers/Makefile"

          # drivers/Kconfig：source 插在**最后一个** endmenu 之前（与下方 BBG 同一套写法）。
          # 不能用 `sed '0,/^endmenu/i'`：GNU sed 对范围内每一行都执行 i 命令，会把 source
          # 插几百遍（历史翻车点：drivers/Kconfig 被塞了 242 行重复 source）。
          if ! grep -q 'drivers/kernelsu/Kconfig' "$COMMON/drivers/Kconfig"; then
            awk '{ a[NR]=$0 }
                 END { last=0;
                       for (i=1;i<=NR;i++) if (a[i] ~ /^endmenu[[:space:]]*$/) last=i;
                       for (i=1;i<=NR;i++) {
                         if (i==last) print "source \"drivers/kernelsu/Kconfig\"";
                         print a[i];
                       } }' "$COMMON/drivers/Kconfig" > "$COMMON/drivers/Kconfig.tmp"
            mv "$COMMON/drivers/Kconfig.tmp" "$COMMON/drivers/Kconfig"
          fi

          echo "==== 挂接结果 ===="
          grep -n 'kernelsu' "$COMMON/drivers/Makefile" || true
          grep -n 'kernelsu' "$COMMON/drivers/Kconfig" || true

      # ---------------------------------------------------------------------
      # SUSFS 内核侧补丁。只有 enable_susfs=true 才跑。
      #
      # 为什么需要「垫片」：susfs4ksu 的补丁以 AOSP GKI 为上下文生成，
      # 拿 trace/hooks 的 include 行当锚点，而厂商树会把这些行删掉 →
      # patch 定位失败 → 整个 hunk 被丢 → 连带丢掉后续 hunk 依赖的宏
      # （如 fs/namespace.c 的 CL_COPY_MNT_NS）。解法：补丁要的那行不存在时
      # 临时插到 anchor 行后面，打完立刻删掉。
      #
      # 策略：这一步只负责「打上 + 暴露冲突」，不做任何自动改写源码。
      # 有 .rej 就硬失败并列清单 —— 因为 .rej 属于「厂商重构了函数」，
      # 必须逐个判断，不能脚本硬改。
      # ---------------------------------------------------------------------
      - name: 应用 SUSFS 内核补丁
        if: env.ENABLE_SUSFS == 'true'
        run: |
          set -uo pipefail
          # GitHub Actions 的 run 默认是 `bash -e`。patch 只要有 hunk 失败就返回 1，
          # -e 会让脚本当场退出，而那时 patch 输出已重定向进 $LOG，
          # 结果是「Step 失败但日志里一行都没有」——上一轮实测就是这个症状。
          set +e
          COMMON="$KERNEL_PLATFORM/common"
          PATCH="$GITHUB_WORKSPACE/susfs.patch"
          LOG="$GITHUB_WORKSPACE/susfs-patch.log"

          # 上游 pin 到具体 commit：否则每次构建都跟分支头漂移，同一份 workflow
          # 产出的内核会随上游改动而变，也无法判断「这次补丁与上次是否同一份」。
          # f76b81f2 = 2026-11-15，susfs4ksu gki-android14-6.1 分支头，SUSFS v2.4.0
          # 升级时只改这一处，并同步 docs/BASELINE.md
          SUSFS_COMMIT="${SUSFS_REF}"
          SUSFS_BASE="https://gitlab.com/simonpunk/susfs4ksu/-/raw/${SUSFS_COMMIT}/kernel_patches"

          curl -fsSL --retry 3 --max-time 90 \
            "$SUSFS_BASE/50_add_susfs_in_gki-android14-6.1.patch" \
            -o "$PATCH" || { echo "::error::下载 SUSFS 补丁失败"; exit 1; }
          echo "SUSFS 补丁：$(wc -c < "$PATCH") 字节，$(grep -c '^diff --git' "$PATCH") 个文件，pin=${SUSFS_COMMIT:0:8}"

          cd "$COMMON"

          # ---- SUSFS 内核侧实现文件：不在 50_add_...patch 里，必须单独取 ----
          # 该补丁只改已有文件（27 个），fs/susfs.c / include/linux/susfs.h /
          # susfs_def.h 是「新增文件」，susfs4ksu 把它们放在内核补丁目录下单独提供。
          # 少了这三个，patch 能打完但 fs/Makefile 挂的 susfs.o 编不出来。
          SUSFS_RAW="$SUSFS_BASE"
          for f in fs/susfs.c include/linux/susfs.h include/linux/susfs_def.h; do
            mkdir -p "$(dirname "$f")"
            curl -fsSL --retry 3 --max-time 90 "$SUSFS_RAW/$f" -o "$f" \
              || { echo "::error::下载 SUSFS 源文件失败：$f"; exit 1; }
            echo "  SUSFS 源文件：$f  $(wc -c < "$f") 字节"
          done

          SHIMMED=()
          shim() {
            local file="$1" line="$2" anchor="$3"
            [ -f "$file" ] || return 0
            # 补丁是否在「该文件的 diff 段落」里把这行当上下文（行首单空格）。
            # 必须限定文件段落：同一行可能出现在别的文件里，全文匹配会误判。
            awk -v h="diff --git a/$file b/$file" -v c=" $line" '
              $0==h {s=1; next}
              /^diff --git / {s=0}
              s && $0==c {f=1}
              END {exit(f?0:1)}' "$PATCH" \
              || { echo "  skip $file：补丁没把这行当上下文"; return 0; }
            grep -qxF "$line" "$file" && { echo "  skip $file：源文件已有该行"; return 0; }
            grep -qxF "$anchor" "$file" || { echo "  skip $file：锚点不存在 [$anchor]"; return 0; }
            if python3 - "$file" "$line" "$anchor" <<'PY'
          import sys
          p, l, a = sys.argv[1:4]
          L = open(p, encoding='utf-8', errors='surrogateescape').readlines()
          for i, x in enumerate(L):
              if x.rstrip('\n') == a:
                  L.insert(i + 1, l + '\n')
                  open(p, 'w', encoding='utf-8', errors='surrogateescape').writelines(L)
                  sys.exit(0)
          sys.exit(1)
          PY
            then
              echo "  垫片注入: $file  ←  $line"
              SHIMMED+=("$file"$'\t'"$line")
            fi
          }

          echo "== 步骤 1/3：注入上下文垫片 =="
          shim fs/namei.c          '#include <trace/hooks/syscall_check.h>' '#include "internal.h"'
          shim fs/namespace.c      '#include <trace/hooks/blk.h>'          '#include "internal.h"'
          shim fs/proc/task_mmu.c  '#include <trace/hooks/mm.h>'           '#include <linux/pkeys.h>'
          shim fs/exec.c           '#include <linux/dma-buf.h>'            '#include <linux/ksm.h>'
          echo "  共注入 ${#SHIMMED[@]} 处垫片"

          echo "== 步骤 2/3：应用补丁 =="
          # 全量落盘，不再过滤 `patching file`，也不再只截末尾 25 行。
          # 上一版是两个过滤器叠加：文件名被 grep 掉 + tail -25，导致 132 个 hunk
          # 只有末尾 25 条可见，「无冲突」的结论建立在一份残缺日志上。这段是把证据补回来。
          patch -p1 --forward --no-backup-if-mismatch < "$PATCH" > "$LOG" 2>&1
          PRC=$?
          grep -E '^patching file' "$LOG" | wc -l | sed 's/^/  定位文件数: /'
          echo "  补丁日志共 $(wc -l < "$LOG") 行（整份作为 artifact 上传）"

          # fuzz = 上下文已有 2 行对不上却仍强行打入，是「落位不精确」的硬信号；
          # offset 只是行号漂移，两者必须分开统计、fuzz 要点名到文件与 hunk。
          FUZZ_N=$(grep -c 'with fuzz' "$LOG" || true)
          OFFSET_N=$(grep -c 'offset [-0-9]* lines' "$LOG" || true)
          if [ "${FUZZ_N:-0}" -gt 0 ]; then
            echo "::warning::SUSFS 补丁有 ${FUZZ_N} 处 fuzz 应用（上下文与上游不一致），清单："
            awk '/^patching file/{f=$3} /with fuzz/{print "  FUZZ  " f "   " $0}' "$LOG"
            {
              echo ""
              echo "### ⚠️ SUSFS 补丁 fuzz 清单（${FUZZ_N} 处）"
              echo '```'
              awk '/^patching file/{f=$3} /with fuzz/{print f " :: " $0}' "$LOG"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::notice::SUSFS 补丁全部 hunk 严格匹配，无 fuzz"
          fi
          echo "  hunk 结果：fuzz ${FUZZ_N} 处 / 行号偏移 ${OFFSET_N} 处"

          # ---- fuzz 的真实落位：patch 只说「模糊打入」，git diff 才说「打进哪里」 ----
          # 只对 fuzz 文件做 diff（全量 diff 没必要），落盘 + 打印，供人工判定语义是否等价。
          if [ "${FUZZ_N:-0}" -gt 0 ]; then
            FUZZ_FILES=$(awk '/^patching file/{f=$3} /with fuzz/{print f}' "$LOG" | sort -u | tr '\n' ' ')
            echo "== fuzz 文件: ${FUZZ_FILES}"
            if git -C "$COMMON" rev-parse --git-dir >/dev/null 2>&1; then
              # shellcheck disable=SC2086
              git -C "$COMMON" diff -- $FUZZ_FILES > "$GITHUB_WORKSPACE/susfs-fuzz.diff" 2>/dev/null || true
              echo "  fuzz 落位 diff：$(wc -l < "$GITHUB_WORKSPACE/susfs-fuzz.diff") 行（随 artifact 保存）"
              head -160 "$GITHUB_WORKSPACE/susfs-fuzz.diff" || true
            else
              echo "  $COMMON 不是 git 仓库，退化为直接打印文件片段"
              for f in $FUZZ_FILES; do
                echo "--- $f（前 40 行含 susfs 的行）"
                grep -n -i 'susfs' "$f" | head -20 || true
              done
            fi
          fi
          grep -E '^patching file' "$LOG" | head -40 || true
          grep -E 'FAILED|ignored' "$LOG" | head -20 || true
          echo "  patch 退出码: $PRC"
          if [ "$PRC" -gt 1 ]; then
            echo "::error::patch 执行异常（rc=$PRC）"
            tail -40 "$LOG"
            exit 1
          fi

          echo "== 步骤 3/3：移除垫片 =="
          for e in ${SHIMMED[@]+"${SHIMMED[@]}"}; do
            f="${e%%$'\t'*}"; l="${e##*$'\t'}"
            if python3 - "$f" "$l" <<'PY'
          import sys
          p, l = sys.argv[1:3]
          L = open(p, encoding='utf-8', errors='surrogateescape').readlines()
          for i, x in enumerate(L):
              if x.rstrip('\n') == l:
                  del L[i]
                  open(p, 'w', encoding='utf-8', errors='surrogateescape').writelines(L)
                  sys.exit(0)
          sys.exit(1)
          PY
            then
              echo "  垫片移除: $f  ←  $l"
            else
              echo "::error::垫片移除失败：$f ($l)"
              exit 1
            fi
          done

          # ---- 定点处理已知无害冲突：fs/proc/base.c 的 include-only hunk ----
          # 该 hunk 只在 include 段插一段条件编译的 susfs_def.h，与厂商逻辑无关；
          # 打不上纯粹因为一加改动了它上面的 include 行。
          # 纪律：只有「新增行全部是 include/条件编译/空行」才自动落位，否则不碰。
          RB=fs/proc/base.c.rej
          if [ -f "$RB" ]; then
            if grep -E '^\+' "$RB" | grep -vE '^\+\+\+' | grep -vE '^\+(#include|#if|#endif|#else)' | grep -vE '^\+[[:space:]]*$' | grep -q .; then
              echo "  fs/proc/base.c.rej 含非 include 内容，不自动处理"
            else
              python3 - "$RB" <<'PY'
          import sys
          rej = sys.argv[1]
          target = 'fs/proc/base.c'
          f = open(target, encoding='utf-8', errors='surrogateescape')
          L = f.readlines()
          f.close()
          if any('#include <linux/susfs_def.h>' in x for x in L):
              sys.exit(0)
          add = []
          for line in open(rej, encoding='utf-8', errors='surrogateescape'):
              if line.startswith('+') and not line.startswith('+++'):
                  add.append(line[1:])
          while add and add[-1].strip() == '':
              add.pop()
          add.append('\n')
          idx = None
          for i, x in enumerate(L):
              if x.rstrip('\n') == '#include "internal.h"':
                  idx = i
                  break
          if idx is None:
              last = None
              for i, x in enumerate(L):
                  if x.startswith('#include '):
                      last = i
              idx = (last + 1) if last is not None else 1
          L[idx:idx] = add
          open(target, 'w', encoding='utf-8').writelines(L)
          print('  fs/proc/base.c：插入 %d 行（锚点行 %d）' % (len(add), idx))
          PY
              rm -f "$RB" && echo "  已消化 $RB"
            fi
          fi

          # ---- 冲突清单：其余一律暴露，不做任何自动改写 ----
          REJ=$(find . -name '*.rej' -not -path './.git/*' | sort)
          N=$(printf '%s' "$REJ" | grep -c . || true)
          {
            echo ""
            echo "### SUSFS 补丁结果"
            echo "- 补丁：\`50_add_susfs_in_gki-android14-6.1.patch\`（$(grep -c '^diff --git' "$PATCH") 文件）"
            echo "- 垫片注入：${#SHIMMED[@]} 处"
            echo "- 未修复 .rej：**${N}** 个"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${N:-0}" -gt 0 ]; then
            {
              echo ""
              echo "#### ❌ 冲突文件与 hunk"
              echo '```'
              for f in $REJ; do
                echo "--- $f"
                grep -E '^@@|^\+\+\+' "$f" | head -12
              done
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::SUSFS 补丁有 ${N} 个 .rej，需逐个人工处理（清单见 Summary）"
            exit 1
          fi

          # ---- 硬校验：宏/头文件真的到位才算成功 ----
          fail=0
          chk() { if eval "$2"; then echo "  ✓ $1"; else echo "  ✗ $1"; echo "::error::校验失败：$1"; fail=1; fi; }
          chk "fs/susfs.c 存在"                 "test -f fs/susfs.c"
          chk "include/linux/susfs.h 存在"      "test -f include/linux/susfs.h"
          chk "include/linux/susfs_def.h 存在"  "test -f include/linux/susfs_def.h"
          chk "fs/Makefile 挂了 susfs"          "grep -q susfs fs/Makefile"
          chk "namespace.c 有 CL_COPY_MNT_NS"   "grep -q 'define CL_COPY_MNT_NS' fs/namespace.c"
          chk "task_mmu.c 含 susfs_def.h"       "grep -q susfs_def.h fs/proc/task_mmu.c"
          chk "无冲突标记"                      "! grep -rqE '^(<<<<<<< |>>>>>>> )' fs kernel mm security"
          [ "$fail" -eq 0 ] || exit 1
          echo "::notice::SUSFS 补丁应用完成，无冲突"

          # ---- 生成「必须出现的 susfs 符号集」，供编译后逐项比对 ----
          # 只收非 static 的 susfs_* 函数定义：static 函数可能被编译器 inline 掉，
          # 拿它当硬判据会假失败；非 static 的跨文件调用，符号必须留下。
          python3 - <<'PY' > "$GITHUB_WORKSPACE/susfs_expected.txt"
          import re
          names = set()
          for ln in open('fs/susfs.c', encoding='utf-8', errors='surrogateescape'):
              if 'static' in ln.split('(')[0]:
                  continue
              m = re.match(r'^[A-Za-z_][A-Za-z0-9_ \t\*]*\b(susfs_[a-z0-9_]+)\s*\(', ln)
              if m:
                  names.add(m.group(1))
          for n in sorted(names):
              print(n)
          PY
          EXP_N=$(wc -l < "$GITHUB_WORKSPACE/susfs_expected.txt")
          echo "  期望符号集（非 static susfs_* 函数）：${EXP_N} 个"
          [ "${EXP_N:-0}" -ge 30 ] \
            || { echo "::error::期望符号集只解析出 ${EXP_N} 个，解析逻辑可能失效（预期约 57）"; exit 1; }
          echo "::notice::已生成 SUSFS 期望符号集（${EXP_N} 个），编译后将逐项比对"

      # ---------------------------------------------------------------------
      # 集成 Baseband-guard（BBG 防格机）。只有 enable_bbg=true 才跑。
      #
      # 规矩同 SUSFS：源码**不入库**，构建时按固定 commit 拉取。
      # 仓库里只留「两行接入 + 校验」，别人的代码一行都不复制。
      #
      # 它是什么：独立 LSM，拦「不可信进程」对块设备的写。
      #   不可信 = SELinux 域为 u:r:su / u:r:ksu / u:r:magisk 的进程及其后代
      #   （tracing.c 的 bprm_creds_for_exec 打标记，cred_prepare/transfer 继承）。
      #   拦的 hook：file_permission(MAY_WRITE) / file_ioctl(破坏性命令) /
      #              inode_setattr(块设备节点的 chmod/chown/truncate)
      #
      # 白名单是「分区名」而不是路径：走 bdev->bd_meta_info->volname（GPT 标签）。
      # 本机实测标签：boot_a/init_boot_a/recovery_a/metadata/misc/userdata 等可写，
      # persist/modemst1/modemst2/super 一律拦下 —— 正是防格机想拦的地方。
      #
      # 关键红线（Kconfig 帮助文本自己写着）：BBG_BLOCK_BOOT / BBG_BLOCK_RECOVERY
      # 一旦打开，系统内就无法刷 boot，只能 recovery/fastboot。而本机 TWRP 不可用、
      # 唯一刷入路径就是 SukiSU Nova 管理器（ksu 域=不可信），开了等于自锁。
      # ⇒ 这两项永久保持 n，下面的配置段和校验段都有硬检查。
      # ---------------------------------------------------------------------
      - name: 集成 Baseband-guard（BBG 防格机，构建时拉取）
        if: env.ENABLE_BBG == 'true'
        run: |
          set -euxo pipefail
          COMMON="$KERNEL_PLATFORM/common"
          SEC="$COMMON/security"
          BBG="$SEC/baseband-guard"
          INFO="$GITHUB_WORKSPACE/bbg-integration.log"

          test -d "$SEC" || { echo "::error::找不到 $SEC"; exit 1; }

          # 放进 common/security/ 里而不是仓库根：Kbuild 只认 srctree 内的目录，
          # 放外面编译时根本不会被扫到。
          rm -rf "$BBG"
          git clone https://github.com/vc-teahouse/Baseband-guard.git "$BBG"
          git -C "$BBG" checkout -q "$BBG_REF"

          SHA=$(git -C "$BBG" rev-parse HEAD)
          echo "pin 期望: $BBG_REF"
          echo "实际 HEAD: $SHA"
          [ "$SHA" = "$BBG_REF" ] || { echo "::error::BBG 没有落在 pin 的 commit 上（$SHA）"; exit 1; }

          # BBG 的 Makefile 里有一句 `test -f .git/shallow && git fetch --unshallow`。
          # 我们用的是完整 clone（不 shallow）不会触发；但把标记文件清掉，
          # 免得以后有人给 clone 加 --depth 时在无网环境被 git 卡住。
          rm -f "$BBG/.git/shallow"

          # 起个提交说明留档：产物里能查到到底用的是哪个 commit
          {
            echo "Baseband-guard"
            echo "  repo: https://github.com/vc-teahouse/Baseband-guard"
            echo "  pin : $SHA"
            echo "  date: $(git -C "$BBG" log -1 --format=%cd --date=iso)"
            echo "  desc: $(git -C "$BBG" log -1 --format=%s)"
            echo "  license: $(ls "$BBG"/LICENSE* 2>/dev/null | head -1 | xargs -r grep -m1 -o 'GNU GENERAL PUBLIC LICENSE.*' || echo GPL-2.0)"
            echo "  enforcement: 编译期硬编码 BB_ENFORCING=1（无运行期开关，无 dry-run）"
            echo "  BLOCK_BOOT=n / BLOCK_RECOVERY=n（开了会在系统内刷不了 boot）"
          } | tee "$INFO"

          # ---- 接入 security/ 的两行（与 setup.sh 等价，只是不用它的符号链接）----
          grep -q 'baseband-guard/' "$SEC/Makefile" \
            || printf '\nobj-$(CONFIG_BBG) += baseband-guard/\n' >> "$SEC/Makefile"

          # Kconfig 插在**最后一个** endmenu 之前（setup.sh 的做法）。
          # 不能用 `0,/endmenu/`：匹配到第一个就把 source 插进了 menu 中间。
          if ! grep -q 'security/baseband-guard/Kconfig' "$SEC/Kconfig"; then
            awk '{ a[NR]=$0 }
                 END { last=0;
                       for (i=1;i<=NR;i++) if (a[i] ~ /^endmenu[[:space:]]*$/) last=i;
                       for (i=1;i<=NR;i++) {
                         if (i==last) print "source \"security/baseband-guard/Kconfig\"";
                         print a[i];
                       } }' "$SEC/Kconfig" > "$SEC/Kconfig.tmp"
            mv "$SEC/Kconfig.tmp" "$SEC/Kconfig"
          fi

          # ---- 前置条件自检：BBG 要的东西这棵树必须有 ----
          test -f "$SEC/selinux/include/objsec.h" \
            || { echo "::error::缺 security/selinux/include/objsec.h（BBG 的 kernel_compat.h 要 include）"; exit 1; }
          test -f "$COMMON/block/blk.h" \
            || { echo "::error::缺 common/block/blk.h（BBG Makefile 用 -I\$(srctree)/block）"; exit 1; }
          grep -q '#define DEFINE_LSM(lsm)' "$COMMON/include/linux/lsm_hooks.h" \
            || { echo "::error::这棵树没有 DEFINE_LSM，走不了现代 LSM 路线（BBG 会退化成改 selinux 源码）"; exit 1; }

          echo "==== 挂接结果 ===="
          grep -n 'baseband-guard' "$SEC/Makefile"
          grep -n 'baseband-guard' "$SEC/Kconfig"
          echo "::notice::Baseband-guard 已接入（pin ${SHA:0:10}），配置在下一步按开关下发"

      # ---------------------------------------------------------------------
      # KernelPatch 工具自检（仅 enable_kpm=true）。放在编译前，是为了让
      # 「kptools 跑不起来」这种问题在几分钟内暴露，而不是等 40 分钟编译完。
      #
      # 为什么 KPM 需要这一步（已核实，不是猜）：
      #   Nova 的 kernel/extension/kpm/kpm.c 里 sukisu_kpm_bridge() 是这样干的：
      #       fn = find_kernel_symbol_exact("__arm64_sys_truncate");
      #       regs.regs[0] = SUKISU_KPM_SUPERCALL_MAGIC; ...
      #       if (fn(&regs) != SUKISU_KPM_ABI_VERSION) return -EOPNOTSUPP;
      #   即它把 __arm64_sys_truncate 当作 KernelPatch 的 supercall 入口来调。
      #   bridge.h 注释也写明 "mirrored in KernelPatch patch/sukisu/supercall.h"。
      #   ⇒ CONFIG_KPM=y 只是打开 KSU 侧通道；真正的执行体是 KernelPatch 的 kpimg，
      #     必须由 kptools 追加到 Image 末尾并替换启动入口，否则 PROBE 返回的不是
      #     ABI_VERSION，管理器就一直显示「KPM 不支持」（实机已复现）。
      # ---------------------------------------------------------------------
      - name: KernelPatch 工具自检（仅 KPM）
        if: env.ENABLE_KPM == 'true'
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          mkdir -p kp
          BASE=https://raw.githubusercontent.com/SukiSU-Nova/SukiSU_patch/main/kpm
          curl -fsSL --retry 3 --max-time 300 "$BASE/kptools-linux" -o kp/kptools-linux \
            || { echo "::error::下载 kptools-linux 失败"; exit 1; }
          curl -fsSL --retry 3 --max-time 300 "$BASE/kpimg" -o kp/kpimg \
            || { echo "::error::下载 kpimg 失败"; exit 1; }
          chmod +x kp/kptools-linux
          ls -l kp/
          echo "== kptools 版本 =="
          ./kp/kptools-linux -v || { echo "::error::kptools 无法执行（指令集/权限）"; exit 1; }
          echo "== kpimg 信息 =="
          ./kp/kptools-linux -l -k kp/kpimg || { echo "::error::kptools 无法解析 kpimg"; exit 1; }
          echo "::notice::KernelPatch 工具自检通过（kptools + kpimg 可用）"

      # ---------------------------------------------------------------------
      # 配置 + 编译。CONFIG_KSU 必须显式置 y：
      # drivers/Makefile 用的是 obj-$(CONFIG_KSU)，选项不是 y 就整体不编。
      # ---------------------------------------------------------------------
      - name: 编译内核（内置 KSU）
        run: |
          set -uo pipefail
          COMMON="$KERNEL_PLATFORM/common"
          cd "$COMMON"
          LOG="$GITHUB_WORKSPACE/build-builtin.log"

          CLANG_DIR=$(find "$KERNEL_PLATFORM/prebuilts/clang/host/linux-x86" \
            -maxdepth 2 -type d -name bin | head -1)
          export PATH="$CLANG_DIR:$PATH"
          export CCACHE_DIR="$HOME/.ccache"
          export CCACHE_MAXSIZE="12G"
          clang --version | head -2

          PAHOLE_BIN="$KERNEL_PLATFORM/prebuilts/kernel-build-tools/linux-x86/bin/pahole"


          # ---- 删除厂商重复导出：test_task_ux ----
          # 一加 6.1.141 的 block/blk-mq.c 多了一行 EXPORT_SYMBOL_GPL(test_task_ux)，
          # 而 vendor 侧的模块自己也导出这个符号。两者同名 → 模块加载时
          # duplicate export 被拒 → 依赖它的厂商模块全部起不来 → 卡第一屏无限重启。
          # 判定条件与社区一致：6.1 且 sublevel >= 141。只删导出，不动函数本体。
          if grep -q '^EXPORT_SYMBOL_GPL(test_task_ux);' block/blk-mq.c 2>/dev/null; then
            python3 - <<'PY'
          import re
          p = 'block/blk-mq.c'
          t = open(p, encoding='utf-8', errors='surrogateescape').read()
          pat = re.compile(r'^[ \t]*EXPORT_SYMBOL_GPL\(test_task_ux\);[ \t]*(?:\n|$)', re.MULTILINE)
          t2, n = pat.subn('', t, count=1)
          if n != 1:
              raise SystemExit('test_task_ux 导出行匹配到 %d 处，预期 1 处' % n)
          open(p, 'w', encoding='utf-8', errors='surrogateescape').write(t2)
          print('  已删除 block/blk-mq.c 的重复导出 EXPORT_SYMBOL_GPL(test_task_ux)')
          PY
            [ $? -eq 0 ] || { echo "::error::删除 test_task_ux 重复导出失败"; exit 1; }
          else
            echo "  block/blk-mq.c 里没有 test_task_ux 导出，跳过"
          fi

          # ---- 模块签名保护（WiFi/蓝牙卡死链的真正根因）----
          # kernel/module/main.c:1281 对“未签名模块导出受保护符号”直接 return -EACCES；
          # 受保护列表来自 android/abi_gki_protected_exports_aarch64（含 rfkill_alloc）。
          # 自编译内核永远拿不到一加官方签名私钥→所有 stock 模块 sig_ok=0→rfkill.ko 被拒
          # →cfg80211→qca_cld3 全断：能开机但没有 wlan0。
          # 不提供该列表时 gen_gki_modules_headers.sh 走 -z 分支生成空数组，
          # NR_PROTECTED_EXPORTS_SYMBOLS=0，该检查恒为 false（官方脚本原生支持此情形）。
          for f in android/abi_gki_protected_exports_aarch64 android/abi_gki_protected_exports_x86_64; do
            if [ -f "$f" ]; then
              mv "$f" "$f.disabled"
              echo "  已禁用受保护导出列表：$f（自编译内核无官方签名私钥）"
            fi
          done

          make -j"$(nproc)" LLVM=1 ARCH=arm64 O=out gki_defconfig >>"$LOG" 2>&1 || {
            echo "::error::gki_defconfig 失败"; tail -30 "$LOG"; exit 1; }

          # 显式开 KSU；SUSFS / KPM 按各自开关处理。
          # 关于 CONFIG_KALLSYMS_ALL（订正 2026-11 的旧判断）：
          #   旧注释写「不加 KALLSYMS_ALL，官方 gki_defconfig 本来就不开」——那句仍然正确，
          #   gki_defconfig 确实不开它。但现在有了明确依据：
          #   Nova 的 kernel/Kconfig 里 config KPM 自带
          #       select KALLSYMS / select KALLSYMS_ALL
          #   即「开 KPM 就一定会有 KALLSYMS_ALL」，这是上游强制的，不是我额外加的。
          #   另实测本机可用内核（stock）的 /proc/config.gz 本来就 CONFIG_KALLSYMS_ALL=y，
          #   所以开 KPM 后这部分与 stock 同侧，不是新增未知项。
          #   代价：kallsyms 表包含数据符号，Image 会变大（预期，不视为失败）。
          scripts/config --file out/.config -e KSU
          if [ "$ENABLE_SUSFS" = "true" ]; then
            scripts/config --file out/.config -e KSU_SUSFS
          else
            scripts/config --file out/.config -d KSU_SUSFS
          fi
          if [ "$ENABLE_KPM" = "true" ]; then
            scripts/config --file out/.config -e KPM
          else
            scripts/config --file out/.config -d KPM
          fi

          # ---- BBG（Baseband-guard 防格机）----
          # 只开功能本身；BLOCK_BOOT / BLOCK_RECOVERY 必须明确关掉：
          # 开了就等于「系统内刷不了 boot」，而本机唯一刷入路径是管理器（ksu 域），
          # 会被自己锁死（TWRP 不可用，只能靠 fastboot 救）。
          if [ "$ENABLE_BBG" = "true" ]; then
            scripts/config --file out/.config -e BBG
            scripts/config --file out/.config -d BBG_BLOCK_BOOT
            scripts/config --file out/.config -d BBG_BLOCK_RECOVERY

            # CONFIG_LSM 必须包含 baseband_guard，否则 BBG 的 Makefile 直接
            # $(error) 中止构建（这是它自己的门禁，不是我们加的）。
            # 顺序要求：**追加到末尾**。原因：BBG 注册 lbs_cred blob，
            # blob 偏移按 CONFIG_LSM 顺序分配；追加末尾可保证 selinux 的偏移
            # 一个字都不变，SUSFS 侧那些按 selinux 结构体解析的代码零扰动。
            # 另外 BBG 在 bprm_creds_for_exec 里读 selinux sid，排在 selinux
            # 之后也最稳。
            CURLSM=$(grep -m1 '^CONFIG_LSM=' out/.config | sed -E 's/^CONFIG_LSM="(.*)"$/\1/')
            if [ -z "$CURLSM" ]; then
              # gki_defconfig 走的是 Kconfig default，此时 .config 里还没有这一行，
              # 用 security/Kconfig 的默认值作为基线（与 stock 一致）。
              CURLSM="landlock,lockdown,yama,loadpin,safesetid,integrity,selinux,smack,tomoyo,apparmor,bpf"
              echo "  .config 里还没有 CONFIG_LSM，按默认基线拼接"
            fi
            case ",$CURLSM," in
              *,baseband_guard,*) NEWLSM="$CURLSM" ;;
              *)                  NEWLSM="$CURLSM,baseband_guard" ;;
            esac
            sed -i "s|^CONFIG_LSM=.*|CONFIG_LSM=\"$NEWLSM\"|" out/.config
            if ! grep -q '^CONFIG_LSM=' out/.config; then
              echo "CONFIG_LSM=\"$NEWLSM\"" >> out/.config
            fi
            echo "  .config: $(grep '^CONFIG_LSM=' out/.config)"
          else
            scripts/config --file out/.config -d BBG
          fi

          # ---- 让 kernel release 精确等于 stock，否则 vendor 模块全部拒绝加载 ----
          # 内核 check_modinfo() 逐字节比较 vermagic；不匹配就 -ENOEXEC，
          # vendor_dlkm 里所有 .ko 加载失败 → 卡第一屏无限重启（无 panic）。
          # stock（也就是能开机的那颗）release 是：
          #   6.1.141-android14-11-o-g984c12362a16
          # KERNELVERSION=6.1.141，所以 LOCALVERSION 必须正好是后面那截。
          STOCK_LOCALVERSION="${STOCK_LOCALVERSION:--android14-11-o-g984c12362a16}"
          # 不能用 scripts/config --set-str：值以 '-' 开头会被当成命令行选项吞掉，
          # .config 里根本不落（上一轮实测 release 变成裸 '6.1.141'）。直接改 .config。
          if grep -q '^CONFIG_LOCALVERSION=' out/.config; then
            sed -i "s|^CONFIG_LOCALVERSION=.*|CONFIG_LOCALVERSION=\"${STOCK_LOCALVERSION}\"|" out/.config
          else
            echo "CONFIG_LOCALVERSION=\"${STOCK_LOCALVERSION}\"" >> out/.config
          fi
          sed -i 's|^CONFIG_LOCALVERSION_AUTO=y|# CONFIG_LOCALVERSION_AUTO is not set|' out/.config
          echo "  .config: $(grep '^CONFIG_LOCALVERSION' out/.config | tr '\n' ' ')"
          # 这份树的 kernel release 后缀**只由 scripts/setlocalversion 产出**：
          # Makefile 里 filechk_kernel.release = echo "$(KERNELVERSION)$(setlocalversion ...)"。
          # 它读 include/config/auto.conf 的 CONFIG_LOCALVERSION，再叠加 BRANCH/KMI/git。
          # 源码树被我们改过（SUSFS/删导出/软链），git 状态必然 dirty，机制算出来一定不是 stock。
          # 所以这里直接让脚本输出与 stock 完全一致的后缀，不赌任何一处自动推导。
          printf '#!/bin/sh\necho "%s"\n' "$STOCK_LOCALVERSION" > scripts/setlocalversion
          chmod +x scripts/setlocalversion
          echo "  setlocalversion 输出: $(scripts/setlocalversion)"
          if [ "$(scripts/setlocalversion)" != "$STOCK_LOCALVERSION" ]; then
            echo "::error::setlocalversion 替换后输出异常，期望 '$STOCK_LOCALVERSION'"
            exit 1
          fi

          make -j"$(nproc)" LLVM=1 ARCH=arm64 O=out olddefconfig >>"$LOG" 2>&1 || {
            echo "::error::olddefconfig 失败"; tail -30 "$LOG"; exit 1; }

          echo "==== 关键配置确认 ===="
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E '^CONFIG_(KSU|KSU_SUSFS|KPM|KALLSYMS|LOCALVERSION|BBG|LSM)' out/.config | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if ! grep -q '^CONFIG_KSU=y' out/.config; then
            echo "::error::CONFIG_KSU 不是 y，KSU 不会被编进内核"
            exit 1
          fi

          # KSU 的 Makefile 里：
          #   KSU_UAPI_INC := $(objtree)/usr/include
          #   ifneq ($(wildcard $(KSU_UAPI_INC)/linux/unistd.h),)
          # 找不到就自动 -DKSU_NO_PREINIT（preinit 功能整个不编）。
          # 而 make 路线不会自动生成 out/usr/include，必须显式 headers_install，
          # 否则出来的是「少了 preinit 的 KSU」——能编过但功能残缺。
          echo "== 生成 out/usr/include（KSU preinit 依赖）=="
          if make LLVM=1 ARCH=arm64 O=out headers_install >>"$LOG" 2>&1; then
            echo "-- headers_install 完成：$(ls out/usr/include/linux/unistd.h 2>/dev/null || echo 未找到)"
          else
            echo "::warning::headers_install 失败，KSU 可能退化为 KSU_NO_PREINIT"
            tail -10 "$LOG"
          fi

          # 计时 + ccache 命中统计：编译慢到底是「机器慢」还是「缓存没命中」，靠这两组数字区分
          ccache -s > "$GITHUB_WORKSPACE/ccache-before.txt" 2>&1 || true
          BUILD_T0=$(date +%s)
          make -j"$(nproc)" \
            LLVM=1 ARCH=arm64 \
            CC="ccache clang" \
            LD=ld.lld HOSTLD=ld.lld \
            PAHOLE="$PAHOLE_BIN" \
            O=out all >>"$LOG" 2>&1 || {
            echo "::error::内核编译失败"
            {
              echo "### ❌ 内置 KSU 内核编译失败"
              echo '```'
              grep -inE 'error:|fatal error|Error [0-9]|undefined!' "$LOG" | head -25
              echo '```'
              echo "#### 日志末尾 30 行"
              echo '```'
              tail -30 "$LOG"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            grep -inE 'error:|fatal error|undefined!' "$LOG" | head -10 \
              | while IFS= read -r l; do echo "::error::${l:0:900}"; done
            exit 1; }

          echo "==== KSU 预编译提示（来自内核 log）===="
          grep -iE 'SukiSU version|KernelSU Manager package|KPM is|preinit|KSU_NO_PREINIT' "$LOG" | head -10 || true
          BUILD_T1=$(date +%s)
          BUILD_SEC=$((BUILD_T1 - BUILD_T0))
          ccache -s > "$GITHUB_WORKSPACE/ccache-after.txt" 2>&1 || true
          echo "编译主目标耗时 ${BUILD_SEC}s"
          echo "== ccache -s（编译后）=="
          cat "$GITHUB_WORKSPACE/ccache-after.txt" 2>/dev/null || true
          {
            echo "| 编译主目标耗时 | ${BUILD_SEC}s |"
            echo ""
            echo "<details><summary>ccache -s（编译后）</summary>"
            echo ""
            echo '```'
            cat "$GITHUB_WORKSPACE/ccache-after.txt" 2>/dev/null || echo '无法读取'
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
          tail -15 "$LOG"

      - name: 校验 Image 与 KSU 是否真的进了内核
        id: verify
        run: |
          set -euo pipefail
          COMMON="$KERNEL_PLATFORM/common"
          IMAGE=$(readlink -f "$COMMON/out/arch/arm64/boot/Image")
          test -f "$IMAGE" || { echo "::error::找不到 Image"; exit 1; }
          echo "IMAGE=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "Image: $IMAGE ($(du -h "$IMAGE" | cut -f1))"

          # O=out 时对象落在 out/drivers/kernelsu/ 下，不是源码目录
          KSU_OBJ="$COMMON/out/drivers/kernelsu/ksu.o"
          PKG_N=$(strings "$COMMON/out/vmlinux" | grep -c 'com.sukisu.nova' || true)
          SYM_N=$(nm "$COMMON/out/vmlinux" 2>/dev/null | grep -cE ' [tTdDbBrR] (ksu_|kernelsu_)' || true)

          {
            echo ""
            echo "### 内置校验"
            echo "| 检查项 | 结果 |"
            echo "|---|---|"
            echo "| CONFIG_KSU | $(grep '^CONFIG_KSU=' "$COMMON/out/.config" || echo 缺失) |"
            echo "| out/drivers/kernelsu/ksu.o | $([ -f "$KSU_OBJ" ] && du -h "$KSU_OBJ" | cut -f1 || echo 缺失) |"
            echo "| vmlinux 中 KSU 包名 | ${PKG_N} 处 |"
            echo "| vmlinux 中 ksu_*/kernelsu_* 符号 | ${SYM_N} 个 |"
            echo "| Image 大小 | $(du -h "$IMAGE" | cut -f1) |"
          } >> "$GITHUB_STEP_SUMMARY"

          # 两个判据取或：包名常量 或 符号表，任一命中都算进了内核
          if [ "${PKG_N:-0}" -eq 0 ] && [ "${SYM_N:-0}" -eq 0 ]; then
            echo "::error::vmlinux 里既没有 KSU 包名也没有 ksu 符号，KSU 没被链进内核"
            exit 1
          fi
          echo "::notice::KSU 已链入内核（包名 ${PKG_N} 处 / 符号 ${SYM_N} 个）"

          # ---- release 硬校验：必须与 stock 完全一致，否则 vendor 模块全拒 ----
          BANNER=$(strings "$COMMON/out/vmlinux" | grep -m1 '^Linux version ' || true)
          REL=$(printf '%s' "$BANNER" | awk '{print $3}')
          # 实测证据（本机）：vendor 模块 vermagic 是 ...-g9005f72316d1，
          # 内核 UTS_RELEASE 是 ...-g984c12362a16，两者不同但模块正常加载、WiFi 正常。
          # 说明 Android KMI 只比对 `6.1.141-android14-11` 这段，git sha 不参与。
          # 因此只要求 KMI 前缀一致；要求逐字节等于 stock 属过度严格（白拦两轮构建）。
          KMI_PREFIX="6.1.141-android14-11"
          echo "kernel release: $REL" >> "$GITHUB_STEP_SUMMARY"
          case "$REL" in
            "$KMI_PREFIX"*)
              echo "::notice::kernel release KMI 段正确：$REL"
              ;;
            *)
              echo "::error::kernel release 是 '$REL'，KMI 段不是 '$KMI_PREFIX'：vendor 模块会拒绝加载"
              exit 1
              ;;
          esac

          # ---- 模块签名保护硬校验：受保护导出列表必须为空 ----
          PEX_H="$COMMON/out/include/generated/gki_module_protected_exports.h"
          if [ ! -f "$PEX_H" ]; then
            echo "::error::找不到 $PEX_H，无法确认模块签名保护状态"
            exit 1
          fi
          PEX_N=$(grep -cE '^[[:space:]]*"' "$PEX_H" || true)
          echo "| protected exports 列表条目 | ${PEX_N} |" >> "$GITHUB_STEP_SUMMARY"
          if [ "${PEX_N:-0}" -ne 0 ]; then
            echo "::error::protected exports 列表仍有 ${PEX_N} 条：未签名模块（stock 的 rfkill.ko 等）会被 -EACCES 拒绝，WiFi 必挂"
            exit 1
          fi
          echo "::notice::protected exports 列表为空，stock 模块不会被签名保护拦截"

          # ---- 重复导出硬校验：test_task_ux 不许再出现在 ksymtab ----
          # 用 nm 查 __ksymtab_ 前缀最准：只要还导出就一定有这个符号；
          # readelf 查字符串表作为双保险（段名缺失时不会误判为通过）。
          if nm "$COMMON/out/vmlinux" 2>/dev/null | grep -q '__ksymtab_test_task_ux' \
             || readelf -p __ksymtab_strings "$COMMON/out/vmlinux" 2>/dev/null | grep -q 'test_task_ux'; then
            echo "::error::vmlinux 仍在导出 test_task_ux，vendor 模块会因 duplicate export 被拒，刷入必卡第一屏"
            exit 1
          fi
          echo "::notice::test_task_ux 已不再导出（ksymtab 干净）"

          # ---- SUSFS 校验：不数个数，逐项比对符号集合 ----
          # 旧版只判「susfs_* 符号数 > 0」，多一个少一个都放行 —— 那不是完整性校验。
          # 现在拿补丁阶段从上游 fs/susfs.c 解析出的「非 static 函数集」当白名单，
          # 与 nm 的实际符号集求差集，缺任何一个即失败并列出名字。
          if [ "${ENABLE_SUSFS:-false}" = "true" ]; then
            SUSFS_OBJ="$COMMON/out/fs/susfs.o"
            VML="$COMMON/out/vmlinux"
            SUSFS_SYM=$(nm "$VML" 2>/dev/null | grep -cE ' [tTdDbBrR] susfs_' || true)
            nm "$VML" 2>/dev/null | awk '$2 ~ /^[tTdDbBrR]$/ {print $3}' | grep '^susfs_' | LC_ALL=C sort -u > /tmp/susfs_have.txt || true
            HAVE_N=$(wc -l < /tmp/susfs_have.txt)
            EXPECT="$GITHUB_WORKSPACE/susfs_expected.txt"
            if [ ! -f "$EXPECT" ]; then
              echo "::error::缺少 susfs_expected.txt（SUSFS 补丁步骤没生成），完整性无法验证"
              exit 1
            fi
            LC_ALL=C sort -u "$EXPECT" > /tmp/susfs_want.txt
            WANT_N=$(wc -l < /tmp/susfs_want.txt)
            MISSING=$(LC_ALL=C comm -23 /tmp/susfs_want.txt /tmp/susfs_have.txt || true)
            MISS_N=$(printf '%s' "$MISSING" | grep -c . || true)
            {
              echo "| out/fs/susfs.o | $([ -f "$SUSFS_OBJ" ] && du -h "$SUSFS_OBJ" | cut -f1 || echo 缺失) |"
              echo "| vmlinux 中 susfs_* 符号（含 static） | ${SUSFS_SYM} 个 / 去重 ${HAVE_N} 个 |"
              echo "| 上游期望函数集（非 static） | ${WANT_N} 个 |"
              echo "| 集合比对缺失 | **${MISS_N}** 个 |"
            } >> "$GITHUB_STEP_SUMMARY"
            if [ "${SUSFS_SYM:-0}" -eq 0 ]; then
              echo "::error::ENABLE_SUSFS=true 但 vmlinux 里没有 susfs_* 符号，SUSFS 没进内核"
              exit 1
            fi
            if [ "${MISS_N:-0}" -gt 0 ]; then
              {
                echo ""
                echo "#### ❌ SUSFS 符号集缺失（${MISS_N} 个）"
                echo '```'
                printf '%s\n' "$MISSING"
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              echo "::error::SUSFS 符号集不完整，缺 ${MISS_N} 个（清单见 Summary）"
              exit 1
            fi
            echo "::notice::SUSFS 符号集合完整（上游期望 ${WANT_N} 个全部命中 / vmlinux susfs_* 共 ${SUSFS_SYM} 个）"
          fi

          # ---- KPM 校验：按 ENABLE_KPM 双向硬校验 ----
          # 机制说明（踩坑换来的，别再按 main 分支的 Kbuild 去想象 builtin）：
          #   builtin 分支是 unity build：kernel/ksu_main.c 直接
          #     #include "extension/kpm.c"
          #     #include "extension/kpm/kpm.c" / compact.c / super_access.c
          #   kernel/Makefile 里只有 `obj-$(CONFIG_KSU) := ksu.o` 与 `ksu-y := ksu_main.o`，
          #   ⇒ **根本不存在 extension/kpm/*.o**。
          #   上一版 CI 拿 obj 存在性当判据，导致 run 45088610906 在编译全成功后被误判失败。
          #   另：KSU_CAN_USE_KPM 是按 LINUX_VERSION_CODE>=4.4 定义的，与 CONFIG_KPM 无关，
          #   所以 sukisu_compact_find_symbol 在开关两边都存在，同样不能当判据。
          # 可靠判据：kernel/extension/kpm.c 里 #ifdef CONFIG_KPM 的一对互斥字符串
          #   CONFIG_KPM=y : "forced VERSION probe, KPM is built in"
          #   CONFIG_KPM=n : "forced VERSION probe, KPM is *not* built in"
          VMLINUX="$COMMON/out/vmlinux"
          KPM_ON=$(strings "$VMLINUX" | grep -cF 'forced VERSION probe, KPM is built in' || true)
          KPM_OFF=$(strings "$VMLINUX" | grep -cF 'forced VERSION probe, KPM is *not* built in' || true)
          KPM_CFG=$(grep -E '^CONFIG_KPM=|^CONFIG_KALLSYMS=|^CONFIG_KALLSYMS_ALL=' "$COMMON/out/.config" | tr '\n' ' ')
          {
            echo "| KPM 相关 config | \`${KPM_CFG}\` |"
            echo "| vmlinux 中 'KPM is built in' 串 | ${KPM_ON} |"
            echo "| vmlinux 中 'KPM is *not* built in' 串 | ${KPM_OFF} |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${ENABLE_KPM:-false}" = "true" ]; then
            # 1) config 三件套：KPM=y，以及被 KPM select 的 KALLSYMS / KALLSYMS_ALL 必须真的生效
            grep -q '^CONFIG_KPM=y' "$COMMON/out/.config" \
              || { echo "::error::ENABLE_KPM=true 但 CONFIG_KPM 不是 y"; exit 1; }
            grep -q '^CONFIG_KALLSYMS=y' "$COMMON/out/.config" \
              || { echo "::error::CONFIG_KALLSYMS 不是 y，KPM 无法解析符号"; exit 1; }
            grep -q '^CONFIG_KALLSYMS_ALL=y' "$COMMON/out/.config" \
              || { echo "::error::CONFIG_KALLSYMS_ALL 没被 KPM select 上，KPM 拿不到数据符号"; exit 1; }
            # 2) 编译日志必须有 kernel/Makefile 的 $(info -- KPM is enabled)
            grep -q 'KPM is enabled' "$GITHUB_WORKSPACE/build-builtin.log" \
              || { echo "::error::编译日志没有 'KPM is enabled'"; exit 1; }
            # 3) 语义判据：必须真的走到 y 分支，且不能残留 n 分支的字符串
            [ "${KPM_ON:-0}" -ge 1 ] \
              || { echo "::error::vmlinux 里没有 'KPM is built in' 串，KPM 实际没编进去"; exit 1; }
            [ "${KPM_OFF:-1}" -eq 0 ] \
              || { echo "::error::vmlinux 里仍出现 'KPM is *not* built in' 串，CONFIG_KPM 未生效"; exit 1; }
            echo "::notice::KPM 已编入内核（built in ${KPM_ON} / not built in ${KPM_OFF} / ${KPM_CFG}）"
          else
            # 关掉时必须确认真的关掉：n 分支的字符串必须在，否则说明开关失效
            [ "${KPM_OFF:-0}" -ge 1 ] \
              || { echo "::error::ENABLE_KPM=false 但 vmlinux 里没有 'KPM is *not* built in' 串，开关可能失效"; exit 1; }
            echo "::notice::KPM 未启用（not built in ${KPM_OFF} / ${KPM_CFG}）"
          fi

          # ---- BBG 校验：按 ENABLE_BBG 双向硬校验 ----
          # 判据分三层，全部是「能反证」的：
          #   1) .config：BBG=y，且两个 BLOCK_* 必须为 not set（开了会自锁）
          #   2) CONFIG_LSM：必须含 baseband_guard，且必须排在 selinux 之后
          #      （blob 偏移与 bprm 时序都依赖这个顺序）
          #   3) 二进制：BBG 的 hook 函数符号必须在 vmlinux 里，
          #      另加 deny 日志字符串 —— 光看 config 不能证明代码真的进去了
          BBG_CFG=$(grep -E '^CONFIG_BBG=|^CONFIG_BBG_BLOCK_BOOT|^CONFIG_BBG_BLOCK_RECOVERY|^CONFIG_LSM=' \
                      "$COMMON/out/.config" | tr '\n' ' ')
          LSMVAL=$(grep -m1 '^CONFIG_LSM=' "$COMMON/out/.config" | sed -E 's/^CONFIG_LSM="(.*)"$/\1/')
          BBG_SYM=$(nm "$VMLINUX" 2>/dev/null | grep -cE ' [tT] (bb_file_permission|bb_inode_setattr|bb_file_ioctl|bb_cred_prepare|bb_cred_transfer|bb_bprm_set_creds)$' || true)
          BBG_DENY=$(strings "$VMLINUX" | grep -cF 'baseband_guard: deny ' || true)
          {
            echo "| BBG 相关 config | \`${BBG_CFG}\` |"
            echo "| vmlinux BBG hook 符号数 | ${BBG_SYM} |"
            echo "| vmlinux 'baseband_guard: deny' 串 | ${BBG_DENY} |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${ENABLE_BBG:-false}" = "true" ]; then
            grep -q '^CONFIG_BBG=y' "$COMMON/out/.config" \
              || { echo "::error::ENABLE_BBG=true 但 CONFIG_BBG 不是 y（可能 SECURITY 依赖没满足）"; exit 1; }
            # 这两条是红线：开了 BBG_BLOCK_BOOT，管理器就刷不回内核了
            grep -q '^# CONFIG_BBG_BLOCK_BOOT is not set' "$COMMON/out/.config" \
              || { echo "::error::CONFIG_BBG_BLOCK_BOOT 不是 n！开了会在系统内刷不了 boot（本机 TWRP 不可用，等于自锁）"; exit 1; }
            grep -q '^# CONFIG_BBG_BLOCK_RECOVERY is not set' "$COMMON/out/.config" \
              || { echo "::error::CONFIG_BBG_BLOCK_RECOVERY 不是 n！"; exit 1; }

            case ",${LSMVAL}," in
              *,baseband_guard,*) : ;;
              *) echo "::error::CONFIG_LSM 里没有 baseband_guard：'${LSMVAL}'"; exit 1 ;;
            esac
            IDX_SEL=$(echo ",${LSMVAL}," | awk -F, '{for(i=1;i<=NF;i++) if($i=="selinux"){print i; exit}}')
            IDX_BBG=$(echo ",${LSMVAL}," | awk -F, '{for(i=1;i<=NF;i++) if($i=="baseband_guard"){print i; exit}}')
            echo "  CONFIG_LSM 顺序：selinux=#${IDX_SEL:-?} baseband_guard=#${IDX_BBG:-?}"
            [ "${IDX_BBG:-0}" -gt "${IDX_SEL:-0}" ] \
              || { echo "::error::baseband_guard 必须排在 selinux 之后（blob 偏移/时序依赖）"; exit 1; }

            # 编译日志：BBG 的 Makefile 自己会打印这两行
            grep -qF 'BBG was enabled!' "$GITHUB_WORKSPACE/build-builtin.log" \
              || { echo "::error::编译日志没有 'BBG was enabled!'，BBG 目录没被 Kbuild 扫到"; exit 1; }
            grep -qF 'Baseband_guard was found in CONFIG_LSM' "$GITHUB_WORKSPACE/build-builtin.log" \
              || { echo "::error::编译日志没有 'Baseband_guard was found in CONFIG_LSM'"; exit 1; }

            [ "${BBG_SYM:-0}" -ge 5 ] \
              || { echo "::error::vmlinux 里 BBG hook 符号只有 ${BBG_SYM} 个（应≥5），BBG 没真正编进去"; exit 1; }
            [ "${BBG_DENY:-0}" -ge 1 ] \
              || { echo "::error::vmlinux 里没有 'baseband_guard: deny' 串，拒绝路径没进内核"; exit 1; }
            echo "::notice::BBG 已编入内核（hook 符号 ${BBG_SYM} 个 / deny 串 ${BBG_DENY} / LSM 顺序 selinux<baseband_guard / 两个 BLOCK_* 均为 n）"
          else
            grep -q '^# CONFIG_BBG is not set' "$COMMON/out/.config" \
              || { echo "::error::ENABLE_BBG=false 但 CONFIG_BBG 不是 not set，开关可能失效"; exit 1; }
            echo "::notice::BBG 未启用（${BBG_CFG}）"
          fi

          echo "==== ksu 符号抽样 ===="
          nm "$COMMON/out/vmlinux" 2>/dev/null | grep -E ' [tTdDbBrR] (ksu_|kernelsu_)' | head -15 || true
          echo "==== 版本串 ===="
          strings "$COMMON/out/vmlinux" | grep -iE 'SukiSU|v3\.0\.0|KernelSU Manager' | head -5 || true

      - name: 收集产物
        run: |
          set -euo pipefail
          COMMON="$KERNEL_PLATFORM/common"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          SRC="${{ steps.verify.outputs.IMAGE }}"
          if [ ! -f "$SRC" ]; then
            echo "::error::Image 路径失效：$SRC"
            exit 1
          fi
          cp "$SRC" "$GITHUB_WORKSPACE/dist/Image"
          cp "$COMMON/out/.config" "$GITHUB_WORKSPACE/dist/.config"
          # 把 SUSFS 的「证据」一起收进产物：patch 全量日志 + 期望符号集。
          # 没有这两份，事后无法证明「132 个 hunk 到底怎么落位的」。
          for f in susfs-patch.log susfs_expected.txt susfs-fuzz.diff bbg-integration.log; do
            if [ -f "$GITHUB_WORKSPACE/$f" ]; then
              cp "$GITHUB_WORKSPACE/$f" "$GITHUB_WORKSPACE/dist/"
              echo "  收入 dist/: $f ($(wc -l < "$GITHUB_WORKSPACE/$f") 行)"
            fi
          done
          ls -lh "$GITHUB_WORKSPACE/dist"

      # ---------------------------------------------------------------------
      # 许可证与源码指引必须**随产物走**，不能只挂在仓库里。
      # 原因：GPL 的义务跟着二进制分发走。别人只拿到刷机包时，也应该能查到
      #   ① 这个 Image 里有哪些第三方代码
      #   ② 各自什么许可（原文）
      #   ③ 对应源码在哪个仓库的哪个 commit
      # 所以 THIRD-PARTY-NOTICES.md / LICENSES/ / SOURCE.md 全部进 dist/，
      # 并在下一步打包时塞进 AnyKernel3 zip 根目录。
      # ---------------------------------------------------------------------
      - name: 产物内附许可声明与源码指引
        run: |
          set -euo pipefail
          COMMON="$KERNEL_PLATFORM/common"
          DIST="$GITHUB_WORKSPACE/dist"
          test -d "$DIST" || { echo "::error::dist 不存在，上一步没跑？"; exit 1; }

          mkdir -p "$DIST/LICENSES"
          cp "$GITHUB_WORKSPACE/NOTICE.md" "$DIST/THIRD-PARTY-NOTICES.md"
          cp "$GITHUB_WORKSPACE/LICENSE"   "$DIST/LICENSES/GPL-2.0.txt"
          echo "  收入 dist/: THIRD-PARTY-NOTICES.md ($(wc -c < "$GITHUB_WORKSPACE/NOTICE.md") B)"
          echo "  收入 dist/: LICENSES/GPL-2.0.txt ($(wc -c < "$GITHUB_WORKSPACE/LICENSE") B)"

          # BBG 是 GPL-2.0：发放含它的二进制时，许可原文必须随之分发
          if [ "$ENABLE_BBG" = "true" ]; then
            BBG_LIC="$COMMON/security/baseband-guard/LICENSE"
            test -f "$BBG_LIC" || { echo "::error::上游 BBG 缺 LICENSE 文件，产物无法合规分发"; exit 1; }
            cp "$BBG_LIC" "$DIST/LICENSES/Baseband-guard-LICENSE.txt"
            echo "  收入 dist/: LICENSES/Baseband-guard-LICENSE.txt ($(wc -c < "$BBG_LIC") B)"
          fi

          KSU_SHA=$(git -C "$KERNEL_PLATFORM/KernelSU" rev-parse HEAD 2>/dev/null || echo unknown)
          if [ "$ENABLE_BBG" = "true" ]; then
            BBG_ROW="| Baseband-guard (BBG) | https://github.com/vc-teahouse/Baseband-guard | \`${BBG_REF}\` |"
          else
            BBG_ROW="| Baseband-guard (BBG) | 本次构建未启用 | - |"
          fi

          cat > "$DIST/SOURCE.md" <<SRC_EOF
          # 对应源码指引（Corresponding Source）

          本构建产物（Image 与 AnyKernel3 刷机包）内的第三方代码全部来自公开上游，
          且**逐项固定了 commit**。按下列信息可复现同一产物，满足 GPL-2.0 对二进制
          分发的源码获取要求。

          ## 构建来源

          - 构建仓库：https://github.com/oopnv70-lab/Ace5-NovaKernel ，commit \`${GITHUB_SHA}\`
          - 构建流水线：GitHub Actions run ${GITHUB_RUN_ID}
          - workflow：\`.github/workflows/build-builtin.yml\`（仅 workflow_dispatch 手动触发）

          ## 组件与固定版本

          | 组件 | 上游来源 | pin |
          | --- | --- | --- |
          | Linux 内核（GKI android14-6.1） | OnePlusOSS kernel_manifest（分支 \`${MANIFEST_BRANCH}\`，设备 \`${DEVICE_MANIFEST}\`） | 由 repo sync 时的 manifest 决定 |
          | SukiSU-Nova（内置） | https://github.com/SukiSU-Nova/SukiSU-Nova | 分支 \`${KSU_REF}\`，commit \`${KSU_SHA}\` |
          | susfs4ksu / SUSFS v2.4.0 | https://gitlab.com/simonpunk/susfs4ksu | \`${SUSFS_REF}\` |
          ${BBG_ROW}
          | KernelPatch（kpimg / kptools） | https://github.com/SukiSU-Nova/SukiSU_patch（\`kpm/\`） | 随构建时拉取 |
          | AnyKernel3 | https://github.com/Osm0sis/AnyKernel3 | 随构建时拉取 |

          ## 许可证

          逐项声明见同目录 \`THIRD-PARTY-NOTICES.md\`，许可原文见 \`LICENSES/\`
          （其中 \`Baseband-guard-LICENSE.txt\` 来自上游仓库原文）。

          > 本文由构建流程自动生成，内容随本次构建的 pin 变化。
          SRC_EOF

          echo "==== dist 目录 ===="
          ls -lh "$DIST" "$DIST/LICENSES"
          echo "::notice::产物已内附许可声明与源码指引（THIRD-PARTY-NOTICES.md / LICENSES/ / SOURCE.md）"

      # ---------------------------------------------------------------------
      # 注入 KernelPatch 到 Image（仅 enable_kpm=true）
      #
      # 为什么必须在打包之前：kptools 会把 kpimg 追加到 Image 末尾，
      # 并把内核启动入口改指向 kpimg，kpimg 在内核启动后接管并完成动态修补。
      # 没有这一步，KSU 侧的 kpm bridge PROBE 永远拿不到 ABI_VERSION，
      # 管理器就显示「KPM 不支持」（已在你设备上复现）。
      #
      # 校验用两条互不依赖的证据：
      #   1) kpimg 的文件头魔数必须出现在 patched Image 里（说明真的追加了）
      #   2) kptools -l -i 必须列出 KernelPatch/patch 信息（说明入口已改）
      # ---------------------------------------------------------------------
      - name: 注入 KernelPatch 到 Image（仅 KPM）
        if: env.ENABLE_KPM == 'true'
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          test -x kp/kptools-linux || { echo "::error::kptools 不存在，自检步骤没跑？"; exit 1; }
          test -f dist/Image || { echo "::error::dist/Image 不存在"; exit 1; }
          BEFORE=$(stat -c%s dist/Image)
          MAGIC=$(head -c 6 kp/kpimg)
          echo "kpimg 魔数: $MAGIC"
          cp dist/Image kp/Image
          cd kp
          SKEY=$(python3 -c "import secrets;print(secrets.token_hex(8))")
          echo "== patch =="
          ./kptools-linux -p -i Image -k kpimg -o Image.kp -s "$SKEY" 2>&1 | tee patch.log
          # kptools 必须有显式输出路径（实测：不给 -o 会报 "empty out image path"）
          OUT=Image.kp
          test -f "$OUT" || { echo "::error::kptools 未生成 Image.kp"; exit 1; }
          AFTER=$(stat -c%s "$OUT")
          echo "Image 大小: $BEFORE -> $AFTER (+$((AFTER-BEFORE)) B)"
          [ "$AFTER" -gt "$BEFORE" ] || { echo "::error::patch 后 Image 未变大，注入失败"; exit 1; }
          grep -a -qF "$MAGIC" "$OUT" \
            || { echo "::error::patched Image 里找不到 kpimg 魔数 $MAGIC，kpimg 没被追加"; exit 1; }
          echo "== kptools -l =="
          ./kptools-linux -l -i "$OUT" 2>&1 | tee list.log
          grep -qiE 'kpatch|kernelpatch|kpimg|superkey|patch' list.log \
            || { echo "::error::kptools -l 未列出任何 patch 信息，入口替换可能失败"; exit 1; }
          grep -q 'patched=true' list.log \
            || { echo "::error::kptools -l 显示 patched 不为 true，注入未生效"; exit 1; }
          cp "$OUT" ../dist/Image
          {
            echo ""
            echo "### KernelPatch 注入"
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| kpimg 魔数 | \`$MAGIC\` |"
            echo "| Image 大小 | $BEFORE → $AFTER 字节（+$((AFTER-BEFORE))） |"
            echo "| superkey | 随机生成、不打印（KPM 走 magic 分派，用不到） |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::KernelPatch 已注入 Image（+$((AFTER-BEFORE)) B）"

      - name: 打包 AnyKernel3（可刷入 zip）
        run: |
          set -uo pipefail
          cd "$GITHUB_WORKSPACE"
          test -f dist/Image || { echo "::error::dist/Image 不存在，无法打包"; exit 1; }

          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git ak3 || {
            echo "::error::克隆 AnyKernel3 失败"; exit 1; }
          cd ak3
          rm -rf .git .github patch ramdisk modules

          cat > anykernel.sh <<'AK3'
          ### AnyKernel3 Ramdisk Mod Script
          ### PKG110 (OnePlus Ace5) - 自编译 GKI + 内置 SukiSU-Nova
          ### 本机实测前提：recovery 是独立分区；boot.img 为 header v4 且无 ramdisk（ramdisk 在 init_boot）。
          ### 因此这里只做「拆 boot → 换内核 → 回写」，不碰 ramdisk、不碰 recovery。
          properties() { '
          kernel.string=PKG110 builtin KSU (self-built GKI)
          do.devicecheck=0
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; } # end properties
          
          # 只写活动槽：ak3-core.sh 的 setup_ak 里有「/postinstall/tmp 是目录且未指定 SLOT_SELECT 时
          # 自动翻成 inactive」的分支，OTA 暂存目录一出现就会把内核写进另一槽（刷成功但开机还是旧内核）。
          # 显式固定 active 直接短路该分支。
          SLOT_SELECT=active;
          
          # boot 分区用分区名，不要写死绝对路径：AK3 在名字模式下会依次试
          # /dev/block/by-name、/dev/block/bootdevice/by-name、/dev/block/platform/*/by-name、
          # /dev/$part 等多条候选路径。写死 /dev/block/by-name/boot 看似更"确定"，
          # 但在管理器自带的刷机环境里那条路径不一定可见，会直接 abort。
          BLOCK=boot;
          IS_SLOT_DEVICE=1;
          RAMDISK_COMPRESSION=auto;
          # boot.img 无 ramdisk、包内不带 avb 工具，用 AK3 的 auto 判定（本机实测落为 false）。
          PATCH_VBMETA_FLAG=auto;
          . tools/ak3-core.sh;
          
          # ---- 写入前三道自检（setup_ak 在 source 时就执行完，此时 $BLOCK 已是解析后的绝对节点）----
          case "$SLOT" in
            _a|_b) : ;;
            *) abort "活动槽异常（SLOT='$SLOT'），拒绝刷写。";;
          esac
          # 机型校验已彻底关闭（do.devicecheck=0）：
          # 本机 ro.product.device = OP5D2BL1、只有 ro.build.product = PKG110，
          # 同型号不同版本（国内版/海外版等）属性也不一致，任何按属性比对都会误伤。
          # 因此这里不做机型比对，只做分区层面的自检（下方），确认目标分区没问题就刷。
          [ -n "$BLOCK" ] || abort "未能确定目标分区，拒绝刷写。"
          [ -b "$BLOCK" ] || ui_print "  ⚠ 目标节点非常规块设备（$BLOCK），继续尝试"
          ui_print "  活动槽：$SLOT"
          ui_print "  目标分区：$BLOCK"
          
          split_boot;
          flash_boot;
          
          # ---- 写后回读自证：把目标分区的 kernel 段读回来，与包内 Image 比 md5 ----
          # header v3/v4 没有 page_size 字段，kernel 固定从 4096 开始；v0-2 才读 @36 的 page_size。
          verify_kernel_write() {
            if ! command -v od >/dev/null 2>&1 || ! command -v md5sum >/dev/null 2>&1; then
              ui_print "  （环境缺 od/md5sum，回读校验跳过）"
              return 0
            fi
            # 先验 boot 头 magic，避免把别的数据当成 header 解析
            MAGIC=$(dd if="$BLOCK" bs=1 count=8 2>/dev/null)
            if [ "$MAGIC" != "ANDROID!" ]; then
              ui_print "  （头部非 ANDROID!，不是 boot 镜像，回读校验跳过）"
              return 0
            fi
            HV=$(od -An -tu4 -j 40 -N 4 "$BLOCK" 2>/dev/null | tr -d ' \n')
            KS=$(od -An -tu4 -j 8  -N 4 "$BLOCK" 2>/dev/null | tr -d ' \n')
            case "$KS" in
              ''|*[!0-9]*) ui_print "  （读不到 kernel_size，回读校验跳过）"; return 0;;
            esac
            if [ "$KS" -gt 268435456 ]; then
              ui_print "  （kernel_size=$KS 不合理，回读校验跳过）"
              return 0
            fi
            KOF=4096
            case "$HV" in
              ''|*[!0-9]*) : ;;
              *) [ "$HV" -lt 3 ] && KOF=$(od -An -tu4 -j 36 -N 4 "$BLOCK" 2>/dev/null | tr -d ' \n');;
            esac
            case "$KOF" in ''|0|*[!0-9]*) KOF=4096;; esac
            SZ=$(wc -c < Image | tr -d ' ')
            [ "$SZ" = "$KS" ] || ui_print "  ⚠ 分区内 kernel 段 $KS 字节，包内 Image $SZ 字节（大小不一致）"
            CNT=$(( (KS + KOF - 1) / KOF ))
            GOT=$(dd if="$BLOCK" bs=$KOF skip=1 count=$CNT 2>/dev/null | head -c "$KS" | md5sum | cut -d' ' -f1)
            WANT=$(md5sum Image | cut -d' ' -f1)
            if [ "$GOT" = "$WANT" ]; then
              ui_print "  ✅ 回读校验通过：$BLOCK kernel 段 $KS 字节，md5 与包内 Image 一致"
              ui_print "     md5=$WANT"
            else
              ui_print "  ❌ 回读校验不一致：expect=$WANT got=$GOT"
              ui_print "     请勿依赖本次启动；回退用 fastboot flash boot$SLOT <原厂 boot.img>"
              ( echo "AK3 verify failed: blk=$BLOCK hdr_v=$HV ks=$KS kof=$KOF want=$WANT got=$GOT" \
                > /data/local/tmp/ak3-verify-fail.log ) 2>/dev/null || true
            fi
          }
          verify_kernel_write;
          AK3

          cp "$GITHUB_WORKSPACE/dist/Image" ./Image
          chmod +x tools/* 2>/dev/null || true

          echo "=== 包内容 ==="
          ls -l anykernel.sh Image
          # 生成的刷写脚本必须自洽：语法过关 + 四道约束在位，缺一项就红
          bash -n anykernel.sh || { echo "::error::anykernel.sh 语法错误"; exit 1; }
          # 反向断言：机型校验必须保持关闭（do.devicecheck=0，且不得再出现 device.name 名单）。
          # 原因：本机 ro.product.device=OP5D2BL1、只有 ro.build.product=PKG110，同型号不同版本
          # 属性也不一致，任何按属性比对都会误伤正确机型（run 20 就是这么刷不进去的）。
          if grep -qE 'do\\.devicecheck=[^0]' anykernel.sh || grep -qE 'device\\.name[0-9]=' anykernel.sh; then
            echo "::error::anykernel.sh 又出现了机型校验（do.devicecheck!=0 或 device.name 名单），会误拦同型号机型"; exit 1
          fi
          grep -qF 'do.devicecheck=0' anykernel.sh || { echo "::error::anykernel.sh 缺少 do.devicecheck=0"; exit 1; }
          for chk in 'SLOT_SELECT=active;' 'BLOCK=boot;' 'IS_SLOT_DEVICE=1;' 'PATCH_VBMETA_FLAG=auto;' 'verify_kernel_write;'; do
            grep -qF "$chk" anykernel.sh || { echo "::error::anykernel.sh 缺约束：$chk"; exit 1; }
          done
          grep -qF 'split_boot;' anykernel.sh && grep -qF 'flash_boot;' anykernel.sh \
            || { echo "::error::anykernel.sh 缺 split_boot/flash_boot"; exit 1; }
          echo "::notice::anykernel.sh 校验通过（语法 OK / 4 条约束在位 / split+flash 在位）"
          ls -l tools/ | head

          # 许可声明与源码指引随包分发：别人只拿到这个 zip 时，也必须能查到
          # 「里面有哪些第三方代码 / 各自许可原文 / 对应源码在哪个 commit」。
          mkdir -p LICENSES
          cp "$GITHUB_WORKSPACE/dist/THIRD-PARTY-NOTICES.md" ./THIRD-PARTY-NOTICES.md
          cp "$GITHUB_WORKSPACE/dist/SOURCE.md"              ./SOURCE.md
          for f in "$GITHUB_WORKSPACE"/dist/LICENSES/*; do
            [ -f "$f" ] && cp "$f" ./LICENSES/
          done
          ls -l THIRD-PARTY-NOTICES.md SOURCE.md
          ls -l LICENSES/

          KPM_TAG=""
          if [ "$ENABLE_KPM" = "true" ]; then KPM_TAG="-kpm"; fi
          BBG_TAG=""
          if [ "$ENABLE_BBG" = "true" ]; then BBG_TAG="-bbg"; fi
          ZIP="$GITHUB_WORKSPACE/dist/PKG110-$KSU_REF${KPM_TAG}${BBG_TAG}-AnyKernel3-$GITHUB_RUN_NUMBER.zip"
          rm -f "$ZIP"
          zip -r9 "$ZIP" . -x '*.git*' >/dev/null || { echo "::error::zip 失败"; exit 1; }
          ls -lh "$ZIP"

          {
            echo ""
            echo "### 打包"
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 包 | \`$(basename "$ZIP")\` |"
            echo "| 大小 | $(du -h "$ZIP" | cut -f1) |"
            echo "| 刷写方式 | AnyKernel3（split_boot/flash_boot，不改 ramdisk，只写活动槽 boot，刷后回读比对 md5） |"
            echo "| 设备校验 | PKG110 / oneplus_ace5 |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::AnyKernel3 打包完成：$(basename "$ZIP")"

      - name: 上传产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PKG110-builtin-${{ env.KSU_REF }}-${{ github.run_number }}
          path: |
            dist/
            build-builtin.log
          if-no-files-found: warn
          retention-days: 14